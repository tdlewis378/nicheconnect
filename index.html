<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NicheConnect Workspace</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#7139F5;--b:#2458D8;--ink:#17112D;--muted:#64748B;--soft:#F5F6FA;--line:#E7E9F0}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--soft)}button,input,textarea,select{font:inherit}.hidden{display:none!important}.app{min-height:100vh}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;z-index:5}.brand{font-weight:800;font-size:20px;display:flex;gap:9px;align-items:center}.mark{width:35px;height:35px;border-radius:10px;background:linear-gradient(135deg,var(--p),var(--b));color:#fff;display:grid;place-items:center}.grad{background:linear-gradient(135deg,var(--p),var(--b));-webkit-background-clip:text;color:transparent}.topright{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}.avatar{width:32px;height:32px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:800}.layout{display:flex}.side{width:230px;background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 68px);padding:18px}.nav{width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:10px;color:var(--muted);font-weight:700;cursor:pointer;margin:2px 0}.nav:hover,.nav.active{background:#eee8ff;color:var(--p)}.main{flex:1;padding:30px;max-width:1250px}.heading{display:flex;justify-content:space-between;gap:20px;align-items:start;margin-bottom:25px}.heading h1{margin:0;font-size:32px}.heading p{color:var(--muted);margin:7px 0}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:750;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#fff;border:1px solid #dfe2ea;color:var(--ink)}.danger{color:#b91c1c}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 18px #17112d08}.stat small{color:var(--muted)}.stat strong{font-size:29px;display:block;margin-top:12px}.twocol{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-top:18px}.card h2{font-size:18px;margin:0}.muted{color:var(--muted)}.empty{text-align:center;padding:50px 20px;color:var(--muted)}.row{display:flex;gap:13px;align-items:center;border-top:1px solid var(--line);padding:14px 0}.row:first-child{border-top:0}.grow{flex:1;min-width:0}.row h3{font-size:14px;margin:0 0 5px}.row p{font-size:13px;color:var(--muted);margin:0}.pill{font-size:11px;background:#eee8ff;color:var(--p);font-weight:800;border-radius:99px;padding:5px 8px}.form{display:grid;gap:13px;max-width:720px}.form label{font-size:13px;font-weight:700}.input{width:100%;margin-top:6px;border:1px solid #dfe2ea;border-radius:9px;padding:11px;outline:none;background:#fff}.input:focus{border-color:var(--p);box-shadow:0 0 0 3px #7139f522}.modalbg{position:fixed;inset:0;background:#17112d99;display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(100%,510px);background:#fff;border-radius:17px;padding:24px;position:relative}.close{position:absolute;right:16px;top:12px;border:0;background:none;font-size:25px;cursor:pointer;color:var(--muted)}.msg{padding:10px;border-radius:9px;font-size:13px;margin-top:12px}.ok{background:#eaf8ef;color:#166534}.err{background:#fef2f2;color:#b91c1c}.auth{max-width:450px;margin:70px auto;padding:30px;background:#fff;border:1px solid var(--line);border-radius:18px}.auth h1{margin-bottom:7px}.auth p{color:var(--muted);font-size:14px}.link{border:0;background:none;color:var(--p);font-weight:750;cursor:pointer}.divider{display:flex;align-items:center;gap:10px;color:#94a3b8;font-size:12px;margin:18px 0}.divider:before,.divider:after{content:'';height:1px;background:var(--line);flex:1}@media(max-width:800px){.side{width:64px;padding:12px 8px}.side .label{display:none}.nav{text-align:center;padding:12px 4px}.main{padding:20px 14px}.grid{grid-template-columns:repeat(2,1fr)}.twocol{grid-template-columns:1fr}.heading{display:block}.heading .btn{margin-top:14px}}
</style></head>
<body><div id="root"></div>
<script>
const URL='https://xpsvypsbquakrvbhujdn.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhwc3Z5cHNicXVha3J2Ymh1amRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NTA5MDIsImV4cCI6MjEwOTEyNjkwMn0.d_tEW2KIHpgX5sfxAjS9X3ilYnf7FZVLYRPpsdGmUE0';
const sb=window.supabase.createClient(URL,KEY);let user=null,profile=null,page='dashboard',opps=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function start(){const r=await sb.auth.getSession();user=r.data.session?.user||null;if(user){await loadProfile();await loadOpps()}render();sb.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;if(user){loadProfile().then(loadOpps).then(render)}else render()})}
async function loadProfile(){const r=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=r.data||{id:user.id,email:user.email,creator_name:user.email.split('@')[0]}}
async function loadOpps(){const r=await sb.from('opportunities').select('*').order('created_at',{ascending:false});opps=r.data||[]}
function render(){document.getElementById('root').innerHTML=user?workspace():auth();}
function auth(){return `<div class="auth"><div class="brand"><div class="mark">✦</div><span>Niche<span class="grad">Connect</span></span></div><h1>Sign in to NicheConnect</h1><p>Your session has ended or you are not signed in.</p><form class="form" onsubmit="login(event)"><label>Email<input class="input" id="ae" type="email" required></label><label>Password<input class="input" id="ap" type="password" required></label><button class="btn primary">Sign in</button></form><p style="text-align:center">Need an account? <button class="link" onclick="location.href=location.pathname">Use the landing page signup</button></p></div>`}
function workspace(){return `<div class="app"><header class="top"><div class="brand"><div class="mark">✦</div><span>Niche<span class="grad">Connect</span></span></div><div class="topright"><span>${esc(profile?.is_admin?'Owner / Admin':'Workspace')}</span><span class="avatar">${esc((user.email||'U')[0].toUpperCase())}</span><button class="btn secondary" onclick="logout()">Sign out</button></div></header><div class="layout"><aside class="side">${[['dashboard','▦','Dashboard'],['discover','⌕','Discover'],['planner','✓','Planner'],['communities','♧','Communities'],['relationships','♡','Relationships'],['settings','⚙','Settings']].map(x=>`<button class="nav ${page===x[0]?'active':''}" onclick="page='${x[0]}';render()"><b>${x[1]}</b> <span class="label">${x[2]}</span></button>`).join('')}</aside><main class="main">${view()}</main></div></div>`}
function view(){if(page==='discover')return discover();if(page==='settings')return settings();if(page==='planner')return planner();return dashboard()}
function header(title,sub,button=''){return `<div class="heading"><div><h1>${title}</h1><p>${sub}</p></div>${button}</div>`}
function dashboard(){return header('Your engagement cockpit','A focused view of the conversations and relationships that matter.',`<button class="btn primary" onclick="openOpp()">+ Add opportunity</button>`)+`<div class="grid"><div class="card stat"><small>Opportunities saved</small><strong>${opps.length}</strong></div><div class="card stat"><small>Today’s tasks</small><strong>0</strong></div><div class="card stat"><small>Comments drafted</small><strong>0</strong></div><div class="card stat"><small>Follow-ups due</small><strong>0</strong></div></div><div class="twocol"><div class="card"><h2>Today’s action queue</h2>${opps.length?opps.slice(0,5).map(o=>`<div class="row"><div class="grow"><h3>${esc(o.title)}</h3><p>${esc(o.source_text||'Review and contribute thoughtfully.')}</p></div><span class="pill">${esc(o.status||'New')}</span></div>`).join(''):`<div class="empty">Save an opportunity to begin your daily workflow.</div>`}</div><div class="card"><h2>Your method</h2><div class="row"><span class="pill">1</span><div><h3>Discover</h3><p>Find worthwhile conversations.</p></div></div><div class="row"><span class="pill">2</span><div><h3>Match</h3><p>Prioritize what fits your goals.</p></div></div><div class="row"><span class="pill">3</span><div><h3>Contribute</h3><p>Prepare a useful response.</p></div></div><div class="row"><span class="pill">4</span><div><h3>Connect</h3><p>Track genuine interactions.</p></div></div></div></div>`}
function discover(){return header('Discover opportunities','Save conversations and communities you can genuinely contribute to.',`<button class="btn primary" onclick="openOpp()">+ Add opportunity</button>`)+`<div class="card">${opps.length?opps.map(o=>`<div class="row"><div class="grow"><h3>${esc(o.title)}</h3><p>${esc(o.source_text||'No source text supplied.')}</p>${o.url?`<a href="${esc(o.url)}" target="_blank" rel="noopener noreferrer">Open original</a>`:''}</div><span class="pill">${esc(o.opportunity_type||'Post')}</span><button class="btn secondary danger" onclick="removeOpp('${o.id}')">Delete</button></div>`).join(''):`<div class="empty"><h2>No opportunities yet</h2><p>Add a public Facebook link and the supplied conversation text.</p><button class="btn primary" onclick="openOpp()">Add your first opportunity</button></div>`}</div>`}
function planner(){return header('Daily planner','Your focused queue will appear here as opportunities are analyzed.')+`<div class="card empty"><h2>Your queue is ready to be built</h2><p>Analyze an opportunity to turn it into a daily action.</p><button class="btn primary" onclick="page='discover';render()">Go to Discover</button></div>`}
function settings(){return header('Settings','Update the profile context used for recommendations.')+`<div class="card"><form class="form" onsubmit="saveProfile(event)"><label>Creator or business name<input class="input" id="pn" value="${esc(profile?.creator_name)}"></label><label>Primary niche<input class="input" id="pi" value="${esc(profile?.niche)}"></label><label>Business description<textarea class="input" id="pd" rows="4">${esc(profile?.business_description)}</textarea></label><label>Ideal audience<input class="input" id="pa" value="${esc(profile?.ideal_audience)}"></label><button class="btn primary">Save profile</button></form><div id="setmsg"></div></div><div class="card" style="margin-top:18px"><h2>Account status</h2><p class="muted">${profile?.is_admin?'Owner/admin access enabled. AI usage exemption enabled.':'Standard workspace account.'}</p></div>`}
function openOpp(){document.getElementById('root').insertAdjacentHTML('beforeend',`<div class="modalbg" id="modal"><div class="modal"><button class="close" onclick="closeModal()">×</button><h2>Add opportunity</h2><p class="muted">Use information you supplied or are authorized to access.</p><form class="form" onsubmit="saveOpp(event)"><label>Title<input class="input" id="ot" required placeholder="Conversation title"></label><label>Public URL<input class="input" id="ou" type="url" placeholder="https://facebook.com/..."></label><label>Type<select class="input" id="oy"><option>Post</option><option>Group</option><option>Page</option><option>Creator profile</option></select></label><label>Conversation text<textarea class="input" id="ox" rows="6" required placeholder="Paste the post or conversation text"></textarea></label><button class="btn primary">Save opportunity</button><div id="omsg"></div></form></div></div>`)}function closeModal(){document.getElementById('modal')?.remove()}
async function saveOpp(e){e.preventDefault();let r=await sb.from('opportunities').insert({user_id:user.id,title:ot.value,url:ou.value,opportunity_type:oy.value,source_text:ox.value,status:'New'});if(r.error){document.getElementById('omsg').innerHTML='<div class="msg err">'+esc(r.error.message)+'</div>';return}closeModal();await loadOpps();page='discover';render()}
async function removeOpp(id){if(!confirm('Delete this opportunity?'))return;await sb.from('opportunities').delete().eq('id',id);await loadOpps();render()}
async function saveProfile(e){e.preventDefault();let r=await sb.from('profiles').upsert({id:user.id,email:user.email,creator_name:pn.value,niche:pi.value,business_description:pd.value,ideal_audience:pa.value,updated_at:new Date().toISOString()});document.getElementById('setmsg').innerHTML='<div class="msg '+(r.error?'err':'ok')+'">'+esc(r.error?.message||'Profile saved.')+'</div>';await loadProfile()}
async function login(e){e.preventDefault();let r=await sb.auth.signInWithPassword({email:ae.value,password:ap.value});if(r.error)alert(r.error.message);else{user=r.data.user;await loadProfile();await loadOpps();render()}}
async function logout(){await sb.auth.signOut();user=null;render()}
start();
</script></body></html>
