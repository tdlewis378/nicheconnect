<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NicheConnect Content Studio</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--p:#7139F5;--b:#2458D8;--ink:#17112D;--muted:#64748B;--bg:#F5F6FA;--line:#E7E9F0}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px}.brand{font-weight:800;font-size:20px;display:flex;align-items:center;gap:9px}.mark{width:35px;height:35px;border-radius:10px;background:linear-gradient(135deg,var(--p),var(--b));color:#fff;display:grid;place-items:center}.grad{background:linear-gradient(135deg,var(--p),var(--b));-webkit-background-clip:text;color:transparent}.topright{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:13px}.layout{display:flex}.side{width:235px;background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 68px);padding:18px}.nav{display:block;width:100%;border:0;background:none;text-align:left;padding:12px;border-radius:10px;color:var(--muted);font-weight:700;margin:2px 0}.nav.active,.nav:hover{background:#eee8ff;color:var(--p)}.main{flex:1;padding:30px;max-width:1240px}.heading{display:flex;justify-content:space-between;gap:20px;margin-bottom:24px}.heading h1{margin:0;font-size:31px}.muted{color:var(--muted);line-height:1.5;font-size:14px}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:750}.primary{background:var(--p);color:#fff}.secondary{background:#fff;border:1px solid #dfe2ea;color:var(--ink)}.auth,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 18px #17112d08}.auth{max-width:460px;margin:70px auto}.form{display:grid;gap:13px}.form label{font-size:13px;font-weight:700}.input{width:100%;margin-top:6px;padding:11px;border:1px solid #dfe2ea;border-radius:9px;background:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:27px;margin-top:9px}.studio{display:grid;grid-template-columns:350px 1fr;gap:18px}.chip{border:1px solid #dfe2ea;background:#fff;border-radius:99px;padding:8px 10px;font-size:12px;margin:3px}.chip.selected{background:#eee8ff;border-color:var(--p);color:var(--p);font-weight:700}.draft{min-height:260px;border:1px solid #dfe2ea;border-radius:12px;padding:15px;margin-top:15px;white-space:pre-wrap;line-height:1.65;outline:none}.row{display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);padding:13px 0}.row:first-child{border-top:0}.grow{flex:1}.pill{font-size:10px;font-weight:800;padding:5px 8px;border-radius:99px;background:#eee8ff;color:var(--p)}.empty{text-align:center;padding:45px;color:var(--muted)}.hidden{display:none}.msg{padding:10px;border-radius:9px;font-size:13px;margin-top:12px;background:#fef2f2;color:#b91c1c}@media(max-width:850px){.side{width:64px;padding:12px 8px}.nav{font-size:0;text-align:center}.nav:before{content:'•';font-size:20px}.main{padding:20px 14px}.studio{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.heading{display:block}}
</style></head><body><div id="root"><div class="auth"><div class="brand"><span class="mark">✦</span><span>Niche<span class="grad">Connect</span></span></div><h1>Loading NicheConnect…</h1><p class="muted">Connecting securely.</p></div></div><script>
(function(){
'use strict';
var sb=window.supabase.createClient('https://xpsvypsbquakrvbhujdn.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhwc3Z5cHNicXVha3J2Ymh1amRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NTA5MDIsImV4cCI6MjEwOTEyNjkwMn0.d_tEW2KIHpgX5sfxAjS9X3ilYnf7FZVLYRPpsdGmUE0');
var user=null,profile=null,page='today',drafts=[],samples=[],schedules=[],format='Text post';
function $(id){return document.getElementById(id)}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}function showError(e){$('root').innerHTML='<div class="auth"><h1>Workspace error</h1><p class="muted">'+esc(e&&e.message||'Unable to load workspace')+'</p><button class="btn primary" onclick="location.reload()">Try again</button></div>'}
async function load(){var p=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(p.error)throw p.error;profile=p.data||{email:user.email};var d=await sb.from('content_drafts').select('*').order('created_at',{ascending:false});if(d.error)throw d.error;drafts=d.data||[];var s=await sb.from('voice_samples').select('*').order('created_at',{ascending:false});if(s.error)throw s.error;samples=s.data||[];var q=await sb.from('content_schedule').select('*').order('scheduled_for',{ascending:true});if(q.error)throw q.error;schedules=q.data||[]}
function render(){if(!user){$('root').innerHTML=auth();$('loginForm').onsubmit=login;return}$('root').innerHTML=app();wire()}
function auth(){return '<div class="auth"><div class="brand"><span class="mark">✦</span><span>Niche<span class="grad">Connect</span></span></div><h1>Welcome back</h1><p class="muted">Sign in to your private workspace.</p><form class="form" id="loginForm"><label>Email<input class="input" id="email" type="email" required></label><label>Password<input class="input" id="password" type="password" required></label><button class="btn primary">Sign in</button></form><div id="error"></div></div>'}
async function login(e){e.preventDefault();var r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error){$('error').innerHTML='<div class="msg">'+esc(r.error.message)+'</div>';return}user=r.data.user;try{await load();render()}catch(x){showError(x)}}
function app(){return '<header class="top"><div class="brand"><span class="mark">✦</span><span>Niche<span class="grad">Connect</span></span></div><div class="topright"><span>'+(profile&&profile.is_admin?'Owner / Admin':'Workspace')+'</span><span>'+esc(user.email)+'</span><button class="btn secondary" id="logout">Sign out</button></div></header><div class="layout"><aside class="side"><button class="nav '+(page==='today'?'active':'')+'" data-page="today">▦ Today</button><button class="nav '+(page==='studio'?'active':'')+'" data-page="studio">✦ Content Studio</button><button class="nav '+(page==='settings'?'active':'')+'" data-page="settings">⚙ Settings</button></aside><main class="main">'+view()+'</main></div>'}
function head(t,s,b){return '<div class="heading"><div><h1>'+t+'</h1><p class="muted">'+s+'</p></div>'+(b||'')+'</div>'}
function view(){if(page==='studio')return studio();if(page==='settings')return '<div class="card"><h2>Settings</h2><p class="muted">'+(profile&&profile.is_admin?'Owner/admin access enabled.':'Standard workspace.')+'</p><p class="muted">Voice samples saved: '+samples.length+'</p></div>';return head('Today','Your content and engagement overview.')+'<div class="grid"><div class="card stat"><small>Drafts</small><strong>'+drafts.length+'</strong></div><div class="card stat"><small>Voice samples</small><strong>'+samples.length+'</strong></div><div class="card stat"><small>Scheduled</small><strong>'+schedules.length+'</strong></div><div class="card stat"><small>Publishing</small><strong>Review</strong></div></div><div class="card" style="margin-top:18px"><h2>Next best action</h2><p class="muted">Create and save a post in your voice.</p><button class="btn primary" data-page="studio">Open Content Studio</button></div>'}
function studio(){return head('Content Studio','Create, save, edit, and schedule posts using your voice profile.','<button class="btn primary" id="generate">Generate draft</button>')+'<div class="studio"><section class="card"><h2>Draft setup</h2><p class="muted">Add a topic and an optional writing sample.</p><form class="form"><label>Goal<select class="input" id="goal"><option>Teach something useful</option><option>Start a conversation</option><option>Tell a personal story</option><option>Build trust</option><option>Promote an offer</option></select></label><label>Topic<textarea class="input" id="topic" rows="4" placeholder="What should this post be about?"></textarea></label><label>Format</label><div><button type="button" class="chip selected" data-format="Text post">Text post</button><button type="button" class="chip" data-format="Story + lesson">Story + lesson</button><button type="button" class="chip" data-format="Short video script">Short video script</button></div><label>Call to action<select class="input" id="cta"><option>Ask a thoughtful question</option><option>Invite a comment</option><option>Softly mention my offer</option><option>No CTA</option></select></label><label>Writing sample<textarea class="input" id="sample" rows="4" placeholder="Paste something you wrote."></textarea></label><button type="button" class="btn secondary" id="saveSample">Save voice sample</button><p class="muted">'+samples.length+' approved sample(s) saved.</p></form></section><section class="card"><h2>Draft workspace</h2><p class="muted">Generate a draft, edit it, then save or schedule it.</p><input class="input" id="title" placeholder="Draft title"><div class="draft" id="editor" contenteditable="true">Your draft will appear here.</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn primary" id="saveDraft">Save draft</button><button class="btn secondary" id="copy">Copy</button><button class="btn secondary" id="scheduleBtn">Schedule</button></div><div id="scheduleBox" class="hidden" style="margin-top:12px"><label>Scheduled for<input class="input" id="when" type="datetime-local"></label><button class="btn primary" id="addSchedule" style="margin-top:10px">Add to weekly queue</button></div></section></div><section class="card" style="margin-top:18px"><h2>Weekly queue</h2>${schedules.length?schedules.map(function(x){return '<div class="row"><div class="grow"><b>Scheduled post</b><p class="muted">'+new Date(x.scheduled_for).toLocaleString()+' · '+esc(x.publish_mode)+'</p></div><span class="pill">'+esc(x.status)+'</span></div>'}).join(''):'<div class="empty">No scheduled posts yet.</div>'}</section>'}
function wire(){document.querySelectorAll('[data-page]').forEach(function(b){b.onclick=function(){page=b.dataset.page;render()}});$('logout').onclick=async function(){await sb.auth.signOut();user=null;render()};document.querySelectorAll('[data-format]').forEach(function(b){b.onclick=function(){format=b.dataset.format;document.querySelectorAll('[data-format]').forEach(function(x){x.classList.remove('selected')});b.classList.add('selected')}});if($('generate'))$('generate').onclick=generate;if($('saveSample'))$('saveSample').onclick=saveSample;if($('saveDraft'))$('saveDraft').onclick=saveDraft;if($('copy'))$('copy').onclick=function(){navigator.clipboard&&navigator.clipboard.writeText($('editor').innerText);alert('Copied')};if($('scheduleBtn'))$('scheduleBtn').onclick=function(){$('scheduleBox').classList.toggle('hidden')};if($('addSchedule'))$('addSchedule').onclick=addSchedule}
function generate(){var topic=$('topic').value.trim()||'using AI to create more time for the work that matters';$('title').value=topic.charAt(0).toUpperCase()+topic.slice(1);$('editor').innerText='If you are trying to '+topic+', start smaller than you think.\n\nYou do not need another complicated system. You need one repeatable step that removes a real bottleneck from your week.\n\nThe useful question is not “What can AI do?” It is “What keeps taking time that should not?” Find that task first, then use one tool to make it lighter.\n\nOne practical improvement at a time is how you build a workflow you will actually keep using.\n\n'+($('cta').value==='No CTA'?'':$('cta').value+'. What would you make easier this week?')}
async function saveSample(){var text=$('sample').value.trim();if(!text)return alert('Add a writing sample first.');var r=await sb.from('voice_samples').insert({user_id:user.id,sample_text:text,source_label:'Content Studio'});if(r.error)return alert(r.error.message);await load();page='studio';render()}
async function saveDraft(){var r=await sb.from('content_drafts').insert({user_id:user.id,title:$('title').value,topic:$('topic').value,goal:$('goal').value,format:format,call_to_action:$('cta').value,body:$('editor').innerText,status:'Draft',approval_status:'Needs review'});if(r.error)return alert(r.error.message);await load();page='studio';render()}
async function addSchedule(){var d=await sb.from('content_drafts').insert({user_id:user.id,title:$('title').value,topic:$('topic').value,goal:$('goal').value,format:format,call_to_action:$('cta').value,body:$('editor').innerText,status:'Draft',approval_status:'Needs review'}).select().single();if(d.error)return alert(d.error.message);var q=await sb.from('content_schedule').insert({user_id:user.id,draft_id:d.data.id,scheduled_for:$('when').value,status:'Queued',publish_mode:'Manual approval'});if(q.error)return alert(q.error.message);await load();page='studio';render()}
async function boot(){try{var r=await sb.auth.getSession();user=r.data&&r.data.session?r.data.session.user:null;if(user)await load();render()}catch(e){showError(e)}}
boot();
})();
</script></body></html>
