<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NicheConnect Content Studio</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--p:#7139F5;--b:#2458D8;--ink:#17112D;--muted:#64748B;--soft:#F5F6FA;--line:#E7E9F0}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--soft);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}.brand{font-weight:800;font-size:20px;display:flex;gap:9px;align-items:center}.mark{width:35px;height:35px;border-radius:10px;background:linear-gradient(135deg,var(--p),var(--b));color:#fff;display:grid;place-items:center}.grad{background:linear-gradient(135deg,var(--p),var(--b));-webkit-background-clip:text;color:transparent}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:750}.primary{background:var(--p);color:#fff}.secondary{background:#fff;border:1px solid #dfe2ea;color:var(--ink)}.auth{max-width:460px;margin:70px auto;padding:30px;background:#fff;border:1px solid var(--line);border-radius:18px}.form{display:grid;gap:13px}.form label{font-size:13px;font-weight:700}.input{width:100%;margin-top:6px;border:1px solid #dfe2ea;border-radius:9px;padding:11px;background:#fff}.link{border:0;background:none;color:var(--p);font-weight:750;cursor:pointer}.msg{padding:10px;border-radius:9px;font-size:13px;margin-top:12px}.ok{background:#eaf8ef;color:#166534}.err{background:#fef2f2;color:#b91c1c}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;z-index:3}.topright{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:13px}.layout{display:flex}.side{width:235px;background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 68px);padding:18px}.nav{width:100%;border:0;background:none;text-align:left;padding:12px;border-radius:10px;color:var(--muted);font-size:13px;font-weight:700;margin:2px 0}.nav.active,.nav:hover{background:#eee8ff;color:var(--p)}.label{margin-left:5px}.main{flex:1;padding:30px;max-width:1240px}.heading{display:flex;justify-content:space-between;gap:20px;align-items:start;margin-bottom:24px}.heading h1{margin:0;font-size:31px}.muted{color:var(--muted);font-size:14px;line-height:1.5}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 18px #17112d08}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:27px;margin-top:9px}.studio{display:grid;grid-template-columns:350px 1fr;gap:18px;align-items:start}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}.chip{border:1px solid #dfe2ea;background:#fff;border-radius:99px;padding:8px 10px;font-size:12px}.chip.selected{background:#eee8ff;border-color:var(--p);color:var(--p);font-weight:700}.voice{padding:13px;border-radius:12px;background:#f4f1ff;border:1px solid #e4dcff;margin-top:12px;font-size:12px;color:#5b4d8d;line-height:1.5}.draft{min-height:260px;border:1px solid #dfe2ea;border-radius:12px;padding:15px;white-space:pre-wrap;line-height:1.65;font-size:14px;outline:none}.draft:focus{border-color:var(--p)}.row{display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);padding:13px 0}.row:first-child{border-top:0}.grow{flex:1;min-width:0}.row h3{margin:0 0 4px;font-size:14px}.row p{margin:0;color:var(--muted);font-size:12px}.pill{font-size:10px;font-weight:800;border-radius:99px;padding:5px 8px;background:#eee8ff;color:var(--p);white-space:nowrap}.empty{text-align:center;padding:40px;color:var(--muted)}.modalbg{position:fixed;inset:0;background:#17112d99;display:grid;place-items:center;padding:18px;z-index:10}.modal{width:min(100%,560px);background:#fff;border-radius:17px;padding:24px;position:relative}.close{position:absolute;right:16px;top:10px;border:0;background:none;font-size:24px;color:var(--muted)}@media(max-width:850px){.side{width:64px;padding:12px 8px}.side .label{display:none}.nav{text-align:center}.main{padding:20px 14px}.studio{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.heading{display:block}}
</style></head><body><div id="root"><div class="auth"><div class="brand"><span class="mark">✦</span><span>Niche<span class="grad">Connect</span></span></div><h1>Loading NicheConnect…</h1><p class="muted">Connecting securely.</p></div></div><script>(function(){const sb=window.supabase.createClient('https://xpsvypsbquakrvbhujdn.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhwc3Z5cHNicXVha3J2Ymh1amRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NTA5MDIsImV4cCI6MjEwOTEyNjkwMn0.d_tEW2KIHpgX5sfxAjS9X3ilYnf7FZVLYRPpsdGmUE0');let user=null,profile=null,page='today',drafts=[],samples=[],schedules=[],selectedFormat='Text post';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const msg=(t,ok)=>'<div class="msg '+(ok?'ok':'err')+'">'+esc(t)+'</div>';async function load(){if(!user)return;let p=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=p.data||{email:user.email,onboarding_completed:true,niche:'',creator_name:user.email};let d=await sb.from('content_drafts').select('*').order('created_at',{ascending:false});drafts=d.data||[];let s=await sb.from('voice_samples').select('*').order('created_at',{ascending:false});samples=s.data||[];let q=await sb.from('content_schedule').select('*,content_drafts(title,body)').order('scheduled_for',{ascending:true});schedules=q.data||[]}function render(){if(!user){$('root').innerHTML=auth();$('af').onsubmit=login;return}$('root').innerHTML=app();wire()}function auth(){return '<div class="auth"><div class="brand"><span class="mark">✦</span><span>Niche<span class="grad">Connect</span></span></div><h1>Welcome back</h1><p class="muted">Sign in to your private workspace.</p><form class="form" id="af"><label>Email<input class="input" id="em" type="email" required></label><label>Password<input class="input" id="pw" type="password" required></label><button class="btn primary">Sign in</button></form><div id="am"></div></div>'}async function login(e){e.preventDefault();let r=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});if(r.error)$('am').innerHTML=msg(r.error.message);else{user=r.data.user;await load();render()}}function app(){return '<header class="top"><div class="brand"><span class="mark">✦</span><span>Niche<span class="grad">Connect</span></span></div><div class="topright"><span>'+(profile?.is_admin?'Owner / Admin':'Workspace')+'</span><span>'+esc(user.email)+'</span><button class="btn secondary" id="out">Sign out</button></div></header><div class="layout"><aside class="side"><button class="nav '+(page==='today'?'active':'')+'" data-page="today">▦ <span class="label">Today</span></button><button class="nav '+(page==='studio'?'active':'')+'" data-page="studio">✦ <span class="label">Content Studio</span></button><button class="nav" data-page="inbox">✉ <span class="label">Reply Inbox</span></button><button class="nav" data-page="radar">◉ <span class="label">Viral Radar</span></button><button class="nav" data-page="analytics">↗ <span class="label">Analytics</span></button><div style="font-size:10px;text-transform:uppercase;color:#94a3b8;font-weight:800;padding:20px 12px 5px">Manage</div><button class="nav" data-page="settings">⚙ <span class="label">Settings</span></button></aside><main class="main">'+view()+'</main></div>'}function head(t,s,b){return '<div class="heading"><div><h1>'+t+'</h1><p class="muted">'+s+'</p></div>'+(b||'')+'</div>'}function view(){if(page==='studio')return studio();if(page==='settings')return settings();if(page==='inbox')return simple('Reply Inbox','Replies will appear here once connected to an authorized platform.');if(page==='radar')return simple('Viral Radar','Viral discovery will require an authorized source or user-supplied trends.');if(page==='analytics')return simple('Analytics','Verified external analytics will appear here after an official platform connection.');return today()}function today(){return head('Today','Your focused content and engagement plan.')+'<div class="grid"><div class="card stat"><small>Drafts</small><strong>'+drafts.length+'</strong></div><div class="card stat"><small>Voice samples</small><strong>'+samples.length+'</strong></div><div class="card stat"><small>Scheduled</small><strong>'+schedules.length+'</strong></div><div class="card stat"><small>Mode</small><strong>Review</strong></div></div><div class="card" style="margin-top:18px"><h2>Next best action</h2><p class="muted">Create a post in your voice, save it as a draft, and add it to your weekly queue.</p><button class="btn primary" data-page="studio">Open Content Studio</button></div>'}function simple(t,s){return head(t,s)+'<div class="card empty"><h2>'+t+'</h2><p>'+s+'</p></div>'}function studio(){return head('Content Studio','Create, save, edit, and schedule posts using your voice profile.',`<button class="btn primary" id="generate">✦ Generate starter draft</button>`)+`<div class="studio"><section class="card"><h2>Draft setup</h2><p class="muted">Give the assistant direction. Add writing samples to improve the voice profile.</p><form class="form" id="setup"><label>Goal<select class="input" id="goal"><option>Teach something useful</option><option>Start a conversation</option><option>Tell a personal story</option><option>Build trust</option><option>Promote an offer</option></select></label><label>Topic or idea<textarea class="input" id="topic" rows="4" placeholder="What should this post be about?"></textarea></label><label>Format</label><div class="chips">${['Text post','Story + lesson','Carousel outline','Short video script'].map(x=>`<button type="button" class="chip ${selectedFormat===x?'selected':''}" data-format="${x}">${x}</button>`).join('')}</div><label>Call to action<select class="input" id="cta"><option>Ask a thoughtful question</option><option>Invite a comment</option><option>Softly mention my offer</option><option>No CTA</option></select></label><label>Writing sample</label><textarea class="input" id="sample" rows="4" placeholder="Paste something you wrote so the voice profile can learn from it."></textarea><button type="button" class="btn secondary" id="saveSample">Save voice sample</button><div class="voice"><b>Voice profile</b><br>${samples.length} sample(s) saved. The secure AI voice service will use approved samples only.</div></form></section><section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><h2>Draft workspace</h2><p class="muted">Generate a starter draft, edit it, then save or schedule it.</p></div><span class="pill" id="draftStatus">Not generated</span></div><div class="empty" id="empty"><h3>Start with an idea</h3><p>Enter a topic and generate a draft.</p></div><div id="draftBox" class="hidden"><input class="input" id="draftTitle" placeholder="Draft title"><div id="editor" class="draft" contenteditable="true"></div><div class="actions" style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="saveDraft">Save draft</button><button class="btn secondary" id="copy">Copy</button><button class="btn secondary" id="scheduleBtn">Schedule</button></div><div id="scheduleBox" class="hidden" style="margin-top:12px"><label class="form">Scheduled for<input class="input" id="when" type="datetime-local"><button class="btn primary" id="addSchedule">Add to weekly queue</button></label></div></div></section></div><section class="card" style="margin-top:18px"><h2>Weekly queue</h2><p class="muted">Posts remain in review until you approve them.</p>${schedules.length?schedules.map(q=>`<div class="row"><div class="grow"><h3>${esc(q.content_drafts?.title||'Scheduled draft')}</h3><p>${new Date(q.scheduled_for).toLocaleString()} · ${esc(q.publish_mode)}</p></div><span class="pill">${esc(q.status)}</span></div>`).join(''):'<div class="empty">No scheduled posts yet.</div>'}</section>`}
function settings(){return head('Settings','Manage your voice profile and workspace.')+'<div class="card"><h2>Account</h2><p class="muted">'+(profile?.is_admin?'Owner/admin access enabled.':'Standard workspace.')+'</p><p class="muted">Niche: '+esc(profile?.niche||'Not set')+'</p><p class="muted">Voice samples saved: '+samples.length+'</p></div>'}function wire(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$('out').onclick=async()=>{await sb.auth.signOut();user=null;render()};document.querySelectorAll('[data-format]').forEach(b=>b.onclick=()=>{selectedFormat=b.dataset.format;render()});let g=$('generate');if(g)g.onclick=generate;let ss=$('saveSample');if(ss)ss.onclick=saveSample;let sd=$('saveDraft');if(sd)sd.onclick=saveDraft;let cp=$('copy');if(cp)cp.onclick=()=>{navigator.clipboard?.writeText($('editor').innerText);alert('Copied')};let sbt=$('scheduleBtn');if(sbt)sbt.onclick=()=>$('scheduleBox').classList.toggle('hidden');let as=$('addSchedule');if(as)as.onclick=addSchedule}function generate(){let topic=$('topic').value.trim()||'building a simple content system with AI';let cta=$('cta').value;let text=`If you are trying to ${topic}, start smaller than you think.\n\nYou do not need another complicated system. You need one repeatable step that removes a real bottleneck from your week.\n\nThe useful question is not “What can AI do?” It is “What keeps taking time that should not?” Find that task first, then use one tool to make it lighter.\n\nOne practical improvement at a time is how you build a workflow you will actually keep using.\n\n${cta==='No CTA'?'':cta+'. What would you make easier this week?'}`;$('empty').classList.add('hidden');$('draftBox').classList.remove('hidden');$('draftTitle').value=topic.charAt(0).toUpperCase()+topic.slice(1);$('editor').innerText=text;$('draftStatus').textContent='Ready to review'}async function saveSample(){let text=$('sample').value.trim();if(!text)return alert('Add a writing sample first.');let r=await sb.from('voice_samples').insert({user_id:user.id,sample_text:text,source_label:'Content Studio'});if(r.error)return alert(r.error.message);await load();render();page='studio';render()}async function saveDraft(){let body=$('editor').innerText.trim();if(!body)return;let r=await sb.from('content_drafts').insert({user_id:user.id,title:$('draftTitle').value,topic:$('topic').value,goal:$('goal').value,format:selectedFormat,call_to_action:$('cta').value,body:body,voice_score:samples.length?80:null,status:'Draft',approval_status:'Needs review'});if(r.error)return alert(r.error.message);await load();render();page='studio';render()}async function addSchedule(){let body=$('editor').innerText.trim();let title=$('draftTitle').value;let d=await sb.from('content_drafts').insert({user_id:user.id,title:title,topic:$('topic').value,goal:$('goal').value,format:selectedFormat,call_to_action:$('cta').value,body:body,status:'Draft',approval_status:'Needs review'}).select().single();if(d.error)return alert(d.error.message);let q=await sb.from('content_schedule').insert({user_id:user.id,draft_id:d.data.id,scheduled_for:$('when').value,publish_mode:'Manual approval',status:'Queued'});if(q.error)return alert(q.error.message);await load();page='studio';render()}boot()})();</script></body></html>
