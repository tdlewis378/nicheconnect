<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NicheConnect</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--p:#7139F5;--b:#2458D8;--ink:#17112D;--muted:#64748B;--soft:#F5F6FA;--line:#E7E9F0}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--soft);color:var(--ink)}button,input,textarea,select{font:inherit}.brand{font-weight:800;font-size:20px;display:flex;align-items:center;gap:9px}.mark{width:35px;height:35px;border-radius:10px;background:linear-gradient(135deg,var(--p),var(--b));color:#fff;display:grid;place-items:center}.grad{background:linear-gradient(135deg,var(--p),var(--b));-webkit-background-clip:text;color:transparent}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:750;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#fff;border:1px solid #dfe2ea;color:var(--ink)}.auth{max-width:460px;margin:70px auto;padding:30px;background:#fff;border:1px solid var(--line);border-radius:18px}.form{display:grid;gap:13px}.form label{font-size:13px;font-weight:700}.input{width:100%;margin-top:6px;border:1px solid #dfe2ea;border-radius:9px;padding:11px;background:#fff}.link{border:0;background:none;color:var(--p);font-weight:750;cursor:pointer}.msg{padding:10px;border-radius:9px;font-size:13px;margin-top:12px}.ok{background:#eaf8ef;color:#166534}.err{background:#fef2f2;color:#b91c1c}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;z-index:5}.topright{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:13px}.layout{display:flex}.side{width:230px;background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 68px);padding:18px}.nav{width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:10px;color:var(--muted);font-weight:700;cursor:pointer;margin:2px 0}.nav.active,.nav:hover{background:#eee8ff;color:var(--p)}.main{flex:1;padding:30px;max-width:1250px}.heading{display:flex;justify-content:space-between;gap:20px;align-items:start;margin-bottom:25px}.heading h1{margin:0;font-size:32px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 18px #17112d08}.stat small{color:var(--muted)}.stat strong{font-size:29px;display:block;margin-top:12px}.twocol{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-top:18px}.card h2{font-size:18px;margin:0}.empty{text-align:center;padding:50px 20px;color:var(--muted)}.row{display:flex;gap:13px;align-items:center;border-top:1px solid var(--line);padding:14px 0}.row:first-child{border-top:0}.grow{flex:1;min-width:0}.row h3{font-size:14px;margin:0 0 5px}.row p{font-size:13px;color:var(--muted);margin:0}.pill{font-size:11px;background:#eee8ff;color:var(--p);font-weight:800;border-radius:99px;padding:5px 8px}.modalbg{position:fixed;inset:0;background:#17112d99;display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(100%,510px);background:#fff;border-radius:17px;padding:24px;position:relative}.close{position:absolute;right:16px;top:12px;border:0;background:none;font-size:25px;cursor:pointer}@media(max-width:800px){.side{width:64px;padding:12px 8px}.side .label{display:none}.nav{text-align:center;padding:12px 4px}.main{padding:20px 14px}.grid{grid-template-columns:repeat(2,1fr)}.twocol{grid-template-columns:1fr}.heading{display:block}}</style></head><body><div id="root"><div class="auth"><div class="brand"><div class="mark">✦</div><span>Niche<span class="grad">Connect</span></span></div><h1>Loading NicheConnect…</h1><p class="muted">Connecting securely.</p></div></div><script>(function(){'use strict';var sb=window.supabase.createClient('https://xpsvypsbquakrvbhujdn.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhwc3Z5cHNicXVha3J2Ymh1amRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NTA5MDIsImV4cCI6MjEwOTEyNjkwMn0.d_tEW2KIHpgX5sfxAjS9X3ilYnf7FZVLYRPpsdGmUE0');var user=null,profile=null,page='dashboard',data={opps:[],communities:[],relationships:[]};function $(id){return document.getElementById(id)}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}function msg(t,ok){return '<div class="msg '+(ok?'ok':'err')+'">'+esc(t)+'</div>'}function showError(e){$('root').innerHTML='<div class="auth"><div class="brand"><div class="mark">✦</div><span>Niche<span class="grad">Connect</span></span></div><h1>Workspace connection problem</h1><p class="muted">We could not finish loading your workspace.</p><div class="msg err">'+esc(e&&e.message||'Supabase request failed.')+'</div><button class="btn primary" style="margin-top:14px" onclick="location.reload()">Try again</button><button class="btn secondary" style="margin:14px 0 0 8px" onclick="sb.auth.signOut().then(function(){location.reload()})">Sign out</button></div>'}async function query(table){var r=await sb.from(table).select('*').order('created_at',{ascending:false});if(r.error)throw r.error;return r.data||[]}async function load(){if(!user)return;var results=await Promise.all([query('opportunities'),query('communities'),query('relationships')]);data={opps:results[0],communities:results[1],relationships:results[2]};var p=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(p.error)throw p.error;profile=p.data||{email:user.email}}function auth(){return '<div class="auth"><div class="brand"><div class="mark">✦</div><span>Niche<span class="grad">Connect</span></span></div><h1>Welcome back</h1><p class="muted">Sign in to your private workspace.</p><form class="form" id="af"><label>Email<input class="input" id="em" type="email" required></label><label>Password<input class="input" id="pw" type="password" required></label><button class="btn primary">Sign in</button></form><div id="am"></div><p style="text-align:center">Need an account? <a href="./" class="link">Return to signup</a></p></div>'}function render(){if(!user){$('root').innerHTML=auth();$('af').onsubmit=async function(e){e.preventDefault();var r=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});if(r.error)$('am').innerHTML=msg(r.error.message);else{user=r.data.user;try{await load();render()}catch(x){showError(x)}}};return}$('root').innerHTML=workspace();wire()}function head(t,s,b){return '<div class="heading"><div><h1>'+t+'</h1><p class="muted">'+s+'</p></div>'+(b||'')+'</div>'}function workspace(){return '<header class="top"><div class="brand"><div class="mark">✦</div><span>Niche<span class="grad">Connect</span></span></div><div class="topright"><span>'+(profile&&profile.is_admin?'Owner / Admin':'Workspace')+'</span><span>'+esc(user.email)+'</span><button class="btn secondary" id="out">Sign out</button></div></header><div class="layout"><aside class="side">'+[['dashboard','▦','Dashboard'],['communities','♧','Communities'],['relationships','♡','Relationships'],['discover','⌕','Discover'],['settings','⚙','Settings']].map(function(x){return '<button class="nav '+(page===x[0]?'active':'')+'" data-page="'+x[0]+'"><b>'+x[1]+'</b> <span class="label">'+x[2]+'</span></button>'}).join('')+'</aside><main class="main">'+view()+'</main></div>'}function view(){if(page==='communities')return list('Community library','Save groups, pages, and creators worth revisiting.','community',data.communities);if(page==='relationships')return list('Relationships','Track genuine interactions and manual follow-ups.','relationship',data.relationships);if(page==='discover')return '<div class="card empty"><h2>Discover opportunities</h2><p>Saved opportunities: '+data.opps.length+'</p></div>';if(page==='settings')return '<div class="card"><h2>Account status</h2><p class="muted">'+(profile&&profile.is_admin?'Owner/admin access enabled.':'Standard workspace.')+'</p></div>';return head('Your engagement cockpit','A focused view of your workspace.','<button class="btn primary" data-open="community">+ Save community</button>')+'<div class="grid"><div class="card stat"><small>Opportunities</small><strong>'+data.opps.length+'</strong></div><div class="card stat"><small>Communities</small><strong>'+data.communities.length+'</strong></div><div class="card stat"><small>Relationships</small><strong>'+data.relationships.length+'</strong></div><div class="card stat"><small>Follow-ups</small><strong>'+data.relationships.filter(function(x){return x.follow_up_date}).length+'</strong></div></div><div class="twocol"><div class="card"><h2>Recent communities</h2>'+(data.communities.slice(0,4).map(function(c){return '<div class="row"><div class="grow"><h3>'+esc(c.name)+'</h3><p>'+esc(c.description||'Saved community')+'</p></div><span class="pill">'+(c.is_favorite?'Favorite':'Saved')+'</span></div>'}).join('')||'<div class="empty">Save your first community.</div>')+'</div><div class="card"><h2>Relationships</h2>'+(data.relationships.slice(0,4).map(function(r){return '<div class="row"><div class="grow"><h3>'+esc(r.contact_name)+'</h3><p>'+esc(r.relationship_status||'New')+'</p></div></div>'}).join('')||'<div class="empty">Add a relationship.</div>')+'</div></div>'}function list(title,sub,type,items){return head(title,sub,'<button class="btn primary" data-open="'+type+'">+ '+(type==='community'?'Save community':'Add relationship')+'</button>')+'<div class="card">'+(items.length?items.map(function(x){return '<div class="row"><div class="grow"><h3>'+esc(x.name||x.contact_name)+'</h3><p>'+esc(x.description||x.notes||x.relationship_status||'Saved')+'</p>'+(x.follow_up_date?'<p>Follow up: '+esc(x.follow_up_date)+'</p>':'')+'</div><span class="pill">'+esc(x.is_favorite?'Favorite':x.relationship_status||'Saved')+'</span><button class="btn secondary" data-delete="'+type+'|'+x.id+'">Delete</button></div>'}).join(''):'<div class="empty"><h2>Nothing saved yet</h2><button class="btn primary" data-open="'+type+'">Get started</button></div>')+'</div>'}function wire(){document.querySelectorAll('[data-page]').forEach(function(b){b.onclick=function(){page=b.dataset.page;render()}});$('out').onclick=async function(){await sb.auth.signOut();user=null;render()};document.querySelectorAll('[data-open]').forEach(function(b){b.onclick=function(){openModal(b.dataset.open)}});document.querySelectorAll('[data-delete]').forEach(function(b){b.onclick=function(){var a=b.dataset.delete.split('|');remove(a[0],a[1])}})}async function remove(type,id){var r=await sb.from(type==='community'?'communities':'relationships').delete().eq('id',id);if(r.error){alert(r.error.message);return}await load();render()}function openModal(type){var c=type==='community',w=document.createElement('div');w.className='modalbg';w.innerHTML='<div class="modal"><button class="close" id="cx">×</button><h2>'+(c?'Save community':'Add relationship')+'</h2><form class="form" id="mf">'+(c?'<label>Name<input class="input" id="n" required></label><label>Public URL<input class="input" id="u" type="url"></label><label>Description<textarea class="input" id="d" rows="3"></textarea></label><label><input id="f" type="checkbox"> Favorite</label>':'<label>Contact name<input class="input" id="n" required></label><label>Profile URL<input class="input" id="u" type="url"></label><label>Status<select class="input" id="s"><option>New</option><option>Engaged</option><option>Familiar</option><option>Connected</option><option>Follow Up</option></select></label><label>Follow-up date<input class="input" id="fd" type="date"></label><label>Notes<textarea class="input" id="d" rows="3"></textarea></label>')+'<button class="btn primary">Save</button><div id="mm"></div></form></div>';document.body.appendChild(w);$('cx').onclick=function(){w.remove()};$('mf').onsubmit=async function(e){e.preventDefault();var payload=c?{user_id:user.id,name:$('n').value,url:$('u').value,description:$('d').value,is_favorite:$('f').checked}:{user_id:user.id,contact_name:$('n').value,profile_url:$('u').value,relationship_status:$('s').value,follow_up_date:$('fd').value||null,notes:$('d').value};var r=await sb.from(c?'communities':'relationships').insert(payload);if(r.error){$('mm').innerHTML=msg(r.error.message);return}w.remove();await load();render()}}async function boot(){try{var r=await sb.auth.getSession();user=r.data&&r.data.session?r.data.session.user:null;if(user){await load()}render()}catch(e){showError(e)}sb.auth.onAuthStateChange(function(e,s){if(e==='SIGNED_OUT'){user=null;render()}})}boot()})();</script></body></html>
