<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NicheConnect Voice Lab</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--p:#7139F5;--b:#2458D8;--ink:#17112D;--muted:#64748B;--bg:#F5F6FA;--line:#E7E9F0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px}.mark{width:35px;height:35px;border-radius:10px;background:linear-gradient(135deg,var(--p),var(--b));display:grid;place-items:center;color:#fff}.grad{background:linear-gradient(135deg,var(--p),var(--b));-webkit-background-clip:text;color:transparent}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:750}.primary{background:var(--p);color:#fff}.secondary{background:#fff;border:1px solid #dfe2ea;color:var(--ink)}.auth{max-width:460px;margin:70px auto;padding:30px;background:#fff;border:1px solid var(--line);border-radius:18px}.form{display:grid;gap:13px}.form label{font-size:13px;font-weight:700}.input{width:100%;margin-top:6px;padding:11px;border:1px solid #dfe2ea;border-radius:9px;background:#fff}.msg{margin-top:12px;padding:10px;border-radius:9px;font-size:13px}.error{background:#fff0f0;color:#a11}.success{background:#eaf8ef;color:#166534}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px}.topright{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:13px}.layout{display:flex}.side{width:235px;background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 68px);padding:18px}.nav{width:100%;display:block;border:0;background:none;text-align:left;padding:12px;border-radius:10px;color:var(--muted);font-weight:700;margin:2px 0}.nav.active,.nav:hover{background:#eee8ff;color:var(--p)}.main{flex:1;max-width:1250px;padding:30px}.heading{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}.heading h1{margin:0;font-size:31px}.muted{color:var(--muted);font-size:14px;line-height:1.5}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 18px #17112d08}.card h2{font-size:18px;margin:0 0 6px}.sample{border-top:1px solid var(--line);padding:14px 0;display:flex;align-items:flex-start;gap:12px}.sample:first-child{border-top:0}.grow{flex:1;min-width:0}.sample p{margin:5px 0;color:var(--muted);font-size:13px;line-height:1.5;white-space:pre-wrap}.tag{font-size:10px;font-weight:800;border-radius:99px;padding:5px 8px;background:#eee8ff;color:var(--p);white-space:nowrap}.profilebox{background:linear-gradient(135deg,#f7f3ff,#eef5ff);border:1px solid #e3dbff;border-radius:13px;padding:16px;margin-top:15px}.profilebox p{font-size:13px;color:#584b87;line-height:1.55}.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.stat small{display:block;color:var(--muted);font-size:11px}.stat b{display:block;margin-top:6px;font-size:18px}.empty{text-align:center;padding:35px;color:var(--muted)}.hidden{display:none}@media(max-width:850px){.side{width:64px;padding:12px 8px}.nav{font-size:0;text-align:center}.nav:before{content:'•';font-size:20px}.main{padding:20px 14px}.grid2{grid-template-columns:1fr}.heading{display:block}}
</style></head><body><div id="root"><div class="auth"><div class="brand"><span class="mark">✦</span><span>Niche<span class="grad">Connect</span></span></div><h1>Loading NicheConnect...</h1><p class="muted">Connecting securely.</p></div></div><script>
(function(){
"use strict";
var sb=window.supabase.createClient("https://xpsvypsbquakrvbhujdn.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhwc3Z5cHNicXVha3J2Ymh1amRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NTA5MDIsImV4cCI6MjEwOTEyNjkwMn0.d_tEW2KIHpgX5sfxAjS9X3ilYnf7FZVLYRPpsdGmUE0");
var user=null, profile=null, samples=[], voice=null, drafts=[], page="voice";
function $(id){return document.getElementById(id)}
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]})}
function showError(e){$("root").innerHTML='<div class="auth"><h1>Workspace error</h1><p class="muted">'+esc(e.message||e)+'</p><button class="btn primary" id="retry">Try again</button></div>';$('retry').onclick=function(){location.reload()}}
async function load(){var p=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();if(p.error)throw p.error;profile=p.data||{};var s=await sb.from("voice_samples").select("*").order("created_at",{ascending:false});if(s.error)throw s.error;samples=s.data||[];var v=await sb.from("voice_profiles").select("*").eq("user_id",user.id).maybeSingle();if(v.error)throw v.error;voice=v.data||null;var d=await sb.from("content_drafts").select("*").order("created_at",{ascending:false});if(d.error)throw d.error;drafts=d.data||[]}
function auth(){return '<div class="auth"><div class="brand"><span class="mark">✦</span><span>Niche<span class="grad">Connect</span></span></div><h1>Welcome back</h1><p class="muted">Sign in to your private workspace.</p><form class="form" id="login"><label>Email<input class="input" id="email" type="email" required></label><label>Password<input class="input" id="password" type="password" required></label><button class="btn primary">Sign in</button></form><div id="loginMsg"></div></div>'}
async function login(e){e.preventDefault();var r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error){$('loginMsg').innerHTML='<div class="msg error">'+esc(r.error.message)+'</div>';return}user=r.data.user;try{await load();render()}catch(x){showError(x)}}
function render(){if(!user){$('root').innerHTML=auth();$('login').onsubmit=login;return}$('root').innerHTML=app();wire()}
function app(){return '<header class="top"><div class="brand"><span class="mark">✦</span><span>Niche<span class="grad">Connect</span></span></div><div class="topright"><span>Voice Lab</span><span>'+esc(user.email)+'</span><button class="btn secondary" id="logout">Sign out</button></div></header><div class="layout"><aside class="side"><button class="nav active">✦ Voice Lab</button><button class="nav" id="studio">▦ Content Studio</button><button class="nav" id="today">▣ Today</button></aside><main class="main">'+view()+'</main></div>'}
function view(){if(page==="studio")return studio();if(page==="today")return '<div class="card"><h1>Today</h1><p class="muted">Your daily content plan will appear here.</p></div>';return lab()}
function lab(){var list=samples.length?samples.map(function(s){return '<div class="sample"><div class="grow"><span class="tag">'+esc(s.source_label||"Writing sample")+'</span><p>'+esc(s.sample_text)+'</p><small class="muted">'+new Date(s.created_at).toLocaleDateString()+'</small></div><button class="btn secondary" data-delete="'+s.id+'">Delete</button></div>'}).join(""): '<div class="empty">No writing samples yet. Add 2–5 samples for a stronger voice profile.</div>';var profileHtml=voice?'<div class="profilebox"><b>Voice profile · '+esc(String(voice.confidence||0))+'% confidence</b><p><b>Tone:</b> '+esc(voice.tone)+'</p><p><b>Summary:</b> '+esc(voice.summary)+'</p><p><b>Style rules:</b> '+esc((voice.style_rules||[]).join(" · "))+'</p><p><b>Avoid:</b> '+esc((voice.prohibited_patterns||[]).join(" · "))+'</p></div>':'<div class="empty">Your voice profile has not been analyzed yet.</div>';return '<div class="heading"><div><h1>Voice Lab</h1><p class="muted">Teach NicheConnect how you naturally write. Only samples you approve are used.</p></div><button class="btn primary" id="analyze">Analyze my voice</button></div><div class="grid2"><section class="card"><h2>Writing samples</h2><p class="muted">Use posts, emails, captions, stories, or sales writing that sounds like you.</p><form class="form" id="sampleForm"><label>Sample label<select class="input" id="label"><option>Facebook post</option><option>Email</option><option>Caption</option><option>Personal story</option><option>Sales post</option><option>Other</option></select></label><label>Paste your writing<textarea class="input" id="text" rows="8" placeholder="Paste a real example of your writing..."></textarea></label><button class="btn secondary">Save sample</button></form><div style="margin-top:15px">'+list+'</div></section><section class="card"><h2>Your voice profile</h2><p class="muted">Analyze your samples to create a reusable voice guide for new drafts.</p>'+profileHtml+'<div class="statrow"><div class="stat"><small>Samples</small><b>'+samples.length+'</b></div><div class="stat"><small>Drafts</small><b>'+drafts.length+'</b></div><div class="stat"><small>Confidence</small><b>'+(voice?String(voice.confidence||0)+"%":"—")+'</b></div></div></section></div>'}
function studio(){return '<div class="card"><h1>Content Studio</h1><p class="muted">Use your saved voice profile when generating content.</p><button class="btn primary" id="backVoice">Open Voice Lab</button></div>'}
function wire(){var l=$('logout');if(l)l.onclick=async function(){await sb.auth.signOut();user=null;render()};var st=$('studio');if(st)st.onclick=function(){page="studio";render()};var td=$('today');if(td)td.onclick=function(){page="today";render()};var form=$('sampleForm');if(form)form.onsubmit=saveSample;var analyze=$('analyze');if(analyze)analyze.onclick=analyzeVoice;var back=$('backVoice');if(back)back.onclick=function(){page="voice";render()};document.querySelectorAll('[data-delete]').forEach(function(b){b.onclick=function(){deleteSample(b.getAttribute('data-delete'))}})}
async function saveSample(e){e.preventDefault();var text=$("text").value.trim();if(!text){alert("Paste a writing sample first.");return}var r=await sb.from("voice_samples").insert({user_id:user.id,sample_text:text,source_label:$("label").value});if(r.error){alert(r.error.message);return}await load();render()}
async function deleteSample(id){if(!confirm("Delete this writing sample?"))return;var r=await sb.from("voice_samples").delete().eq("id",id);if(r.error){alert(r.error.message);return}await load();render()}
async function analyzeVoice(){if(samples.length<1){alert("Add at least one writing sample first.");return}var r=await sb.functions.invoke("content-ai",{body:{action:"voice_profile",samples:samples.map(function(s){return s.sample_text})}});if(r.error){alert(r.error.message);return}if(r.data&&r.data.error){alert(r.data.error);return}var p=r.data.profile;var saved=await sb.from("voice_profiles").upsert({user_id:user.id,summary:p.voice_summary||"",tone:p.tone||"",style_rules:p.recurring_patterns||[],prohibited_patterns:p.avoid||[],confidence:p.confidence||0,updated_at:new Date().toISOString()});if(saved.error){alert(saved.error.message);return}await load();render()}
async function boot(){try{var r=await sb.auth.getSession();user=r.data&&r.data.session?r.data.session.user:null;if(user)await load();render()}catch(e){showError(e)}}boot();
})();
</script></body></html>
