<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NicheConnect</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--p:#7139F5;--b:#2458D8;--ink:#17112D;--muted:#64748B;--soft:#F5F6FA;--line:#E7E9F0}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--soft);color:var(--ink)}button,input,textarea,select{font:inherit}.brand{font-weight:800;font-size:20px;display:flex;align-items:center;gap:9px}.mark{width:35px;height:35px;border-radius:10px;background:linear-gradient(135deg,var(--p),var(--b));color:#fff;display:grid;place-items:center}.grad{background:linear-gradient(135deg,var(--p),var(--b));-webkit-background-clip:text;color:transparent}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:750;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#fff;border:1px solid #dfe2ea;color:var(--ink)}.auth,.onboard{max-width:720px;margin:50px auto;padding:30px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 35px #17112d0d}.auth{max-width:460px}.auth h1,.onboard h1{margin:24px 0 8px}.muted{color:var(--muted);line-height:1.55;font-size:14px}.form{display:grid;gap:14px}.form label{font-size:13px;font-weight:700}.input{width:100%;margin-top:6px;border:1px solid #dfe2ea;border-radius:9px;padding:11px;background:#fff;outline:none}.input:focus{border-color:var(--p);box-shadow:0 0 0 3px #7139f522}.msg{padding:10px;border-radius:9px;font-size:13px;margin-top:12px}.ok{background:#eaf8ef;color:#166534}.err{background:#fef2f2;color:#b91c1c}.link{border:0;background:none;color:var(--p);font-weight:750;cursor:pointer}.divider{display:flex;gap:10px;align-items:center;color:#94a3b8;font-size:12px;margin:18px 0}.divider:before,.divider:after{content:'';height:1px;background:var(--line);flex:1}.progress{display:flex;gap:8px;margin:24px 0}.dot{height:6px;flex:1;border-radius:99px;background:#e5e7eb}.dot.active{background:var(--p)}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:9px 12px;border:1px solid #dfe2ea;border-radius:99px;background:#fff;color:#475569;cursor:pointer;font-size:13px}.chip.selected{background:#eee8ff;color:var(--p);border-color:var(--p);font-weight:700}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{border:1px solid #dfe2ea;border-radius:12px;padding:14px;display:flex;gap:9px;cursor:pointer;font-size:13px}.choice:has(input:checked){border-color:var(--p);background:#faf9ff}.choice small{display:block;color:var(--muted);margin-top:4px;line-height:1.4}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px}.topright{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:13px}.layout{display:flex}.side{width:230px;background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 68px);padding:18px}.nav{width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:10px;color:var(--muted);font-weight:700;cursor:pointer;margin:2px 0}.nav.active,.nav:hover{background:#eee8ff;color:var(--p)}.main{flex:1;padding:30px;max-width:1250px}.heading{display:flex;justify-content:space-between;gap:20px;align-items:start;margin-bottom:25px}.heading h1{margin:0;font-size:32px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.stat small{color:var(--muted)}.stat strong{font-size:29px;display:block;margin-top:12px}.empty{text-align:center;padding:50px 20px;color:var(--muted)}@media(max-width:800px){.side{width:64px;padding:12px 8px}.side .label{display:none}.nav{text-align:center;padding:12px 4px}.main{padding:20px 14px}.grid{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.heading{display:block}}</style></head><body><div id="root"><div class="auth"><div class="brand"><span class="mark">✦</span><span>Niche<span class="grad">Connect</span></span></div><h1>Loading NicheConnect…</h1><p class="muted">Connecting securely.</p></div></div><script>(function(){const sb=window.supabase.createClient('https://xpsvypsbquakrvbhujdn.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhwc3Z5cHNicXVha3J2Ymh1amRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NTA5MDIsImV4cCI6MjEwOTEyNjkwMn0.d_tEW2KIHpgX5sfxAjS9X3ilYnf7FZVLYRPpsdGmUE0');let user=null,profile=null,step=1,page='dashboard',mode='signin';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const say=(t,ok)=>'<div class="msg '+(ok?'ok':'err')+'">'+esc(t)+'</div>';
async function loadProfile(){const r=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(r.error)throw r.error;profile=r.data||{id:user.id,email:user.email,onboarding_completed:false}}
function render(){if(!user){$('root').innerHTML=auth();wireAuth();return}if(!profile||profile.onboarding_completed!==true){$('root').innerHTML=onboarding();wireOnboarding();return}$('root').innerHTML=workspace();wireWorkspace()}
function auth(){return '<div class="auth"><div class="brand"><span class="mark">✦</span><span>Niche<span class="grad">Connect</span></span></div><h1 id="title">Welcome back</h1><p id="sub">Sign in to your private workspace.</p><form class="form" id="form"><label id="nameWrap" style="display:none">Name or business<input class="input" id="name"></label><label>Email<input class="input" id="email" type="email" required></label><label>Password<input class="input" id="password" type="password" minlength="8" required></label><button class="btn primary" id="submit">Sign in</button></form><button class="link" id="forgot">Forgot password?</button><div class="divider">OR</div><button class="btn secondary" id="google">Continue with Google</button><div id="authMsg"></div><p style="text-align:center"><span id="switchText">New to NicheConnect?</span> <button class="link" id="switch">Create account</button></p></div>'}
function wireAuth(){$('form').onsubmit=async e=>{e.preventDefault();const r=mode==='signup'?await sb.auth.signUp({email:$('email').value,password:$('password').value,options:{data:{full_name:$('name').value},emailRedirectTo:location.href}}):await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)$('authMsg').innerHTML=say(r.error.message);else if(mode==='signup')$('authMsg').innerHTML=say('Account created. Check your email, confirm it, then sign in.',true);else{user=r.data.user;await loadProfile();render()}};$('switch').onclick=()=>{mode=mode==='signin'?'signup':'signin';$('title').textContent=mode==='signup'?'Create your account':'Welcome back';$('sub').textContent=mode==='signup'?'Start building your focused workflow.':'Sign in to your private workspace.';$('nameWrap').style.display=mode==='signup'?'block':'none';$('submit').textContent=mode==='signup'?'Create account':'Sign in';$('forgot').style.display=mode==='signup'?'none':'inline-block';$('switchText').textContent=mode==='signup'?'Already have an account?':'New to NicheConnect?';$('switch').textContent=mode==='signup'?'Sign in':'Create account'};$('forgot').onclick=async()=>{const r=await sb.auth.resetPasswordForEmail($('email').value,{redirectTo:location.href});$('authMsg').innerHTML=r.error?say(r.error.message):say('Password reset email sent.',true)};$('google').onclick=()=>sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}})}
function onboarding(){const t=['Your business foundation','Your ideal audience','Your community radar','Your engagement control','Review your setup'][step-1];return '<div class="onboard"><div class="brand"><span class="mark">✦</span><span>Niche<span class="grad">Connect</span></span></div><div class="progress">'+[1,2,3,4,5].map(i=>'<span class="dot '+(i<=step?'active':'')+'"></span>').join('')+'</div><h1>'+t+'</h1><p class="muted">'+['Tell us what you do so we can find better-fit conversations.','Define the people and topics you want to connect with.','Choose the communities and content you want on your radar.','You decide what happens externally. Review-first is recommended.','Confirm these settings before entering your workspace.'][step-1]+'</p>'+body()+'<div style="display:flex;justify-content:space-between;margin-top:22px"><button class="btn secondary" id="back" '+(step===1?'disabled':'')+'>Back</button><button class="btn primary" id="next">'+(step===5?'Save setup':'Continue')+'</button></div></div>'}
function body(){if(step===1)return '<div class="form"><label>Creator or business name<input class="input" id="business" value="'+esc(profile.creator_name)+'"></label><label>Products, services, or expertise<textarea class="input" id="offer" rows="3">'+esc(profile.business_description)+' </textarea></label><label>Primary niche<select class="input" id="niche"><option value="">Choose a category</option>'+['AI tools & automation','Online business & digital products','Coaching & consulting','Affiliate marketing','Health & wellness','Personal finance','Marketing & content','Career & professional growth','Real estate','Other / custom niche'].map(x=>'<option '+(profile.niche===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label></div>';if(step===2)return '<div class="form"><label>Ideal audience<textarea class="input" id="audience" rows="3">'+esc(profile.ideal_audience)+' </textarea></label><label>Audience interests</label><div class="chips">'+['AI tools','Online income','Digital products','Content creation','Productivity','Marketing','Coaching','Side hustles','Small business','Career change'].map(x=>'<button type="button" class="chip '+((profile.audience_interests||[]).includes(x)?'selected':'')+'" data-i="'+x+'">'+x+'</button>').join('')+'</div><label>Priority keywords<input class="input" id="keywords" value="'+esc((profile.priority_keywords||[]).join(', '))+'"></label><label>Topics to avoid<input class="input" id="avoid" value="'+esc(profile.topics_to_avoid)+'"></label></div>';if(step===3)return '<div class="form"><label>Community types</label><div class="grid2">'+['Public Facebook groups','Facebook pages and creators','Public posts','Existing relationships'].map(x=>'<label class="choice"><input type="checkbox" value="'+x+'" '+((profile.community_types||[]).includes(x)?'checked':'')+'>'+x+'</label>').join('')+'</div><label>Known community links or names<textarea class="input" id="known" rows="4">'+esc(profile.known_communities)+' </textarea></label></div>';if(step===4)return '<div class="form"><label class="choice"><input type="radio" name="mode" value="review" '+((profile.engagement_mode||'review')==='review'?'checked':'')+'> Review before action — AI drafts, you approve.</label><label class="choice"><input type="radio" name="mode" value="assist" '+(profile.engagement_mode==='assist'?'checked':'')+'> Assisted browsing — collect visible authorized content.</label><label class="choice"><input type="radio" name="mode" value="manual" '+(profile.engagement_mode==='manual'?'checked':'')+'> Manual only — organize and track.</label><p class="muted">Automatic comments, friend requests, group joining, and unsolicited messages are not enabled.</p></div>';return '<div class="card"><p><b>Niche:</b> '+esc(profile.niche||'Not selected')+'</p><p><b>Audience:</b> '+esc(profile.ideal_audience||'Not added')+'</p><p><b>Engagement mode:</b> '+esc(profile.engagement_mode||'review')+'</p><p><b>Account:</b> '+esc(user.email)+'</p></div>'}
async function saveStep(){let p={id:user.id,email:user.email,updated_at:new Date().toISOString()};if(step===1){p.creator_name=$('business').value;p.business_description=$('offer').value.trim();p.niche=$('niche').value}if(step===2){p.ideal_audience=$('audience').value.trim();p.audience_interests=[...document.querySelectorAll('[data-i].selected')].map(x=>x.dataset.i);p.priority_keywords=$('keywords').value.split(',').map(x=>x.trim()).filter(Boolean);p.topics_to_avoid=$('avoid').value.trim()}if(step===3){p.community_types=[...document.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value);p.known_communities=$('known').value.trim()}if(step===4)p.engagement_mode=document.querySelector('input[name=mode]:checked')?.value||'review';if(step===5)p.onboarding_completed=true;const r=await sb.from('profiles').upsert(p,{onConflict:'id'});if(r.error)throw r.error;await loadProfile()}
function wireOnboarding(){$('next').onclick=async()=>{try{await saveStep();if(step<5){step++;render()}else{render()}}catch(e){alert('Could not save this step: '+e.message)}};$('back').onclick=()=>{if(step>1){step--;render()}};document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>b.classList.toggle('selected'))}
function workspace(){return '<header class="top"><div class="brand"><span class="mark">✦</span><span>Niche<span class="grad">Connect</span></span></div><div class="topright"><span>'+(profile.is_admin?'Owner / Admin':'Workspace')+'</span><span>'+esc(user.email)+'</span><button class="btn secondary" id="out">Sign out</button></div></header><div class="layout"><aside class="side">'+['Dashboard','Discover','Communities','Relationships','Planner','Settings'].map(x=>'<button class="nav '+(page===x.toLowerCase()?'active':'')+'" data-p="'+x.toLowerCase()+'">'+x+'</button>').join('')+'</aside><main class="main"><div class="heading"><div><h1>Your engagement cockpit</h1><p class="muted">Your personalized workflow is ready.</p></div></div><div class="grid"><div class="card stat"><small>Onboarding</small><strong>Complete</strong></div><div class="card stat"><small>Mode</small><strong style="font-size:18px">'+esc(profile.engagement_mode||'review')+'</strong></div><div class="card stat"><small>Niche</small><strong style="font-size:16px">'+esc(profile.niche||'—')+'</strong></div><div class="card stat"><small>Account</small><strong style="font-size:16px">'+(profile.is_admin?'Admin':'Active')+'</strong></div></div><div class="card" style="margin-top:18px"><h2>Next recommended action</h2><p class="muted">Your profile is ready. We can now build the opportunity discovery and review queue.</p></div></main></div>'}function wireWorkspace(){$('out').onclick=async()=>{await sb.auth.signOut();user=null;profile=null;render()};document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{page=b.dataset.p;render()})}
async function boot(){try{const r=await sb.auth.getSession();user=r.data?.session?.user||null;if(user)await loadProfile();render()}catch(e){$('root').innerHTML='<div class="auth"><h1>Connection problem</h1><p class="muted">'+esc(e.message)+'</p><button class="btn primary" onclick="location.reload()">Try again</button></div>'}}boot()})();</script></body></html>
