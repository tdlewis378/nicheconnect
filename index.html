<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NicheConnect</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--purple:#7139F5;--blue:#2458D8;--ink:#17112D;--muted:#64748B;--bg:#F5F6FA;--line:#E7E9F0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.brand{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:800}.mark{width:35px;height:35px;border-radius:10px;background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;display:grid;place-items:center}.gradient{background:linear-gradient(135deg,var(--purple),var(--blue));-webkit-background-clip:text;color:transparent}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:700}.primary{background:var(--purple);color:#fff}.secondary{background:#fff;border:1px solid #dfe2ea;color:var(--ink)}.auth{max-width:450px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px}.auth h1{margin-top:25px}.muted{color:var(--muted);font-size:14px;line-height:1.5}.form{display:grid;gap:13px}.form label{font-size:13px;font-weight:700}.input{width:100%;margin-top:6px;border:1px solid #dfe2ea;border-radius:9px;padding:11px;background:#fff}.error{background:#fff0f0;color:#a11;padding:10px;border-radius:9px;margin-top:12px;font-size:13px}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px}.topright{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}.layout{display:flex}.side{width:235px;background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 68px);padding:18px}.nav{width:100%;display:block;text-align:left;border:0;background:none;border-radius:10px;padding:12px;color:var(--muted);font-weight:700;margin:2px 0}.nav.active,.nav:hover{background:#eee8ff;color:var(--purple)}.main{flex:1;max-width:1250px;padding:30px}.heading{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}.heading h1{margin:0;font-size:31px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 18px #17112d08}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:27px;margin-top:9px}.studio{display:grid;grid-template-columns:350px 1fr;gap:18px}.chip{border:1px solid #dfe2ea;border-radius:99px;background:#fff;padding:8px 10px;font-size:12px;margin:3px}.chip.selected{background:#eee8ff;border-color:var(--purple);color:var(--purple);font-weight:700}.draft{min-height:260px;border:1px solid #dfe2ea;border-radius:12px;padding:15px;margin-top:14px;white-space:pre-wrap;line-height:1.65;outline:none}.row{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:13px 0}.row:first-child{border-top:0}.grow{flex:1}.pill{font-size:10px;font-weight:800;border-radius:99px;padding:5px 8px;background:#eee8ff;color:var(--purple)}.empty{text-align:center;padding:45px;color:var(--muted)}.hidden{display:none}@media(max-width:850px){.side{width:64px;padding:12px 8px}.nav{font-size:0;text-align:center}.nav:before{content:'•';font-size:20px}.main{padding:20px 14px}.studio{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.heading{display:block}}
</style>
</head>
<body>
<div id="root"><div class="auth"><div class="brand"><span class="mark">✦</span><span>Niche<span class="gradient">Connect</span></span></div><h1>Loading NicheConnect...</h1><p class="muted">Connecting securely.</p></div></div>
<script>
(function () {
  'use strict';
  var supabaseClient = window.supabase.createClient(
    'https://xpsvypsbquakrvbhujdn.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhwc3Z5cHNicXVha3J2Ymh1amRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NTA5MDIsImV4cCI6MjEwOTEyNjkwMn0.d_tEW2KIHpgX5sfxAjS9X3ilYnf7FZVLYRPpsdGmUE0'
  );
  var user = null;
  var profile = null;
  var drafts = [];
  var samples = [];
  var schedules = [];
  var page = 'today';
  var selectedFormat = 'Text post';

  function byId(id) { return document.getElementById(id); }
  function escapeText(value) {
    return String(value || '').replace(/[&<>"']/g, function (char) {
      var map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'};
      return map[char];
    });
  }
  function showError(error) {
    byId('root').innerHTML = '<div class="auth"><h1>Workspace error</h1><p class="muted">' + escapeText(error && error.message ? error.message : 'Unable to load the workspace.') + '</p><button class="btn primary" id="retry">Try again</button></div>';
    byId('retry').onclick = function () { window.location.reload(); };
  }
  async function loadData() {
    var profileResult = await supabaseClient.from('profiles').select('*').eq('id', user.id).maybeSingle();
    if (profileResult.error) throw profileResult.error;
    profile = profileResult.data || {email:user.email};
    var draftsResult = await supabaseClient.from('content_drafts').select('*').order('created_at', {ascending:false});
    if (draftsResult.error) throw draftsResult.error;
    drafts = draftsResult.data || [];
    var samplesResult = await supabaseClient.from('voice_samples').select('*').order('created_at', {ascending:false});
    if (samplesResult.error) throw samplesResult.error;
    samples = samplesResult.data || [];
    var scheduleResult = await supabaseClient.from('content_schedule').select('*').order('scheduled_for', {ascending:true});
    if (scheduleResult.error) throw scheduleResult.error;
    schedules = scheduleResult.data || [];
  }
  function authView() {
    return '<div class="auth"><div class="brand"><span class="mark">✦</span><span>Niche<span class="gradient">Connect</span></span></div><h1>Welcome back</h1><p class="muted">Sign in to your private workspace.</p><form class="form" id="loginForm"><label>Email<input class="input" id="loginEmail" type="email" required></label><label>Password<input class="input" id="loginPassword" type="password" required></label><button class="btn primary">Sign in</button></form><div id="loginError"></div></div>';
  }
  async function login(event) {
    event.preventDefault();
    var result = await supabaseClient.auth.signInWithPassword({email:byId('loginEmail').value, password:byId('loginPassword').value});
    if (result.error) { byId('loginError').innerHTML = '<div class="error">' + escapeText(result.error.message) + '</div>'; return; }
    user = result.data.user;
    try { await loadData(); render(); } catch (error) { showError(error); }
  }
  function render() {
    if (!user) { byId('root').innerHTML = authView(); byId('loginForm').onsubmit = login; return; }
    byId('root').innerHTML = appView(); wireApp();
  }
  function appView() {
    return '<header class="top"><div class="brand"><span class="mark">✦</span><span>Niche<span class="gradient">Connect</span></span></div><div class="topright"><span>' + (profile && profile.is_admin ? 'Owner / Admin' : 'Workspace') + '</span><span>' + escapeText(user.email) + '</span><button class="btn secondary" id="logout">Sign out</button></div></header><div class="layout"><aside class="side"><button class="nav ' + (page === 'today' ? 'active' : '') + '" data-page="today">▦ Today</button><button class="nav ' + (page === 'studio' ? 'active' : '') + '" data-page="studio">✦ Content Studio</button><button class="nav ' + (page === 'settings' ? 'active' : '') + '" data-page="settings">⚙ Settings</button></aside><main class="main">' + pageView() + '</main></div>';
  }
  function header(title, subtitle, button) { return '<div class="heading"><div><h1>' + title + '</h1><p class="muted">' + subtitle + '</p></div>' + (button || '') + '</div>'; }
  function pageView() {
    if (page === 'studio') return studioView();
    if (page === 'settings') return '<div class="card"><h2>Settings</h2><p class="muted">' + (profile && profile.is_admin ? 'Owner/admin access enabled.' : 'Standard workspace.') + '</p><p class="muted">Voice samples saved: ' + samples.length + '</p></div>';
    return header('Today', 'Your content and engagement overview.') + '<div class="grid"><div class="card stat"><small>Drafts</small><strong>' + drafts.length + '</strong></div><div class="card stat"><small>Voice samples</small><strong>' + samples.length + '</strong></div><div class="card stat"><small>Scheduled</small><strong>' + schedules.length + '</strong></div><div class="card stat"><small>Publishing</small><strong>Review</strong></div></div><div class="card" style="margin-top:18px"><h2>Next best action</h2><p class="muted">Create and save a post in your voice.</p><button class="btn primary" data-page="studio">Open Content Studio</button></div>';
  }
  function studioView() {
    var formatButtons = ['Text post','Story + lesson','Short video script'].map(function (name) { return '<button type="button" class="chip ' + (selectedFormat === name ? 'selected' : '') + '" data-format="' + name + '">' + name + '</button>'; }).join('');
    var scheduleRows = schedules.length ? schedules.map(function (item) { return '<div class="row"><div class="grow"><b>Scheduled post</b><p class="muted">' + new Date(item.scheduled_for).toLocaleString() + ' · ' + escapeText(item.publish_mode) + '</p></div><span class="pill">' + escapeText(item.status) + '</span></div>'; }).join('') : '<div class="empty">No scheduled posts yet.</div>';
    return header('Content Studio','Create, save, edit, and schedule posts using your voice profile.','<button class="btn primary" id="generate">Generate draft</button>') + '<div class="studio"><section class="card"><h2>Draft setup</h2><p class="muted">Add a topic and an optional writing sample.</p><div class="form"><label>Goal<select class="input" id="goal"><option>Teach something useful</option><option>Start a conversation</option><option>Tell a personal story</option><option>Build trust</option><option>Promote an offer</option></select></label><label>Topic<textarea class="input" id="topic" rows="4" placeholder="What should this post be about?"></textarea></label><label>Format</label><div>' + formatButtons + '</div><label>Call to action<select class="input" id="cta"><option>Ask a thoughtful question</option><option>Invite a comment</option><option>Softly mention my offer</option><option>No CTA</option></select></label><label>Writing sample<textarea class="input" id="sample" rows="4" placeholder="Paste something you wrote."></textarea></label><button type="button" class="btn secondary" id="saveSample">Save voice sample</button><p class="muted">' + samples.length + ' approved sample(s) saved.</p></div></section><section class="card"><h2>Draft workspace</h2><p class="muted">Generate a draft, edit it, then save or schedule it.</p><input class="input" id="draftTitle" placeholder="Draft title"><div class="draft" id="editor" contenteditable="true">Your draft will appear here.</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn primary" id="saveDraft">Save draft</button><button class="btn secondary" id="copyDraft">Copy</button><button class="btn secondary" id="scheduleButton">Schedule</button></div><div id="scheduleBox" style="display:none;margin-top:12px"><label>Scheduled for<input class="input" id="scheduledFor" type="datetime-local"></label><button class="btn primary" id="addSchedule" style="margin-top:10px">Add to weekly queue</button></div></section></div><section class="card" style="margin-top:18px"><h2>Weekly queue</h2>' + scheduleRows + '</section>';
  }
  function generateDraft() {
    var topic = byId('topic').value.trim() || 'using AI to create more time for the work that matters';
    byId('draftTitle').value = topic.charAt(0).toUpperCase() + topic.slice(1);
    byId('editor').innerText = 'If you are trying to ' + topic + ', start smaller than you think.\n\nYou do not need another complicated system. You need one repeatable step that removes a real bottleneck from your week.\n\nThe useful question is not “What can AI do?” It is “What keeps taking time that should not?” Find that task first, then use one tool to make it lighter.\n\nOne practical improvement at a time is how you build a workflow you will actually keep using.\n\n' + (byId('cta').value === 'No CTA' ? '' : byId('cta').value + '. What would you make easier this week?');
  }
  async function saveSample() { var text = byId('sample').value.trim(); if (!text) { alert('Add a writing sample first.'); return; } var result = await supabaseClient.from('voice_samples').insert({user_id:user.id,sample_text:text,source_label:'Content Studio'}); if (result.error) { alert(result.error.message); return; } await loadData(); render(); page = 'studio'; render(); }
  async function saveDraft() { var result = await supabaseClient.from('content_drafts').insert({user_id:user.id,title:byId('draftTitle').value,topic:byId('topic').value,goal:byId('goal').value,format:selectedFormat,call_to_action:byId('cta').value,body:byId('editor').innerText,status:'Draft',approval_status:'Needs review'}); if (result.error) { alert(result.error.message); return; } await loadData(); page = 'studio'; render(); }
  async function addSchedule() { var draft = await supabaseClient.from('content_drafts').insert({user_id:user.id,title:byId('draftTitle').value,topic:byId('topic').value,goal:byId('goal').value,format:selectedFormat,call_to_action:byId('cta').value,body:byId('editor').innerText,status:'Draft',approval_status:'Needs review'}).select().single(); if (draft.error) { alert(draft.error.message); return; } var queue = await supabaseClient.from('content_schedule').insert({user_id:user.id,draft_id:draft.data.id,scheduled_for:byId('scheduledFor').value,status:'Queued',publish_mode:'Manual approval'}); if (queue.error) { alert(queue.error.message); return; } await loadData(); page = 'studio'; render(); }
  function wireApp() { document.querySelectorAll('[data-page]').forEach(function (button) { button.onclick = function () { page = button.getAttribute('data-page'); render(); }; }); byId('logout').onclick = async function () { await supabaseClient.auth.signOut(); user = null; render(); }; document.querySelectorAll('[data-format]').forEach(function (button) { button.onclick = function () { selectedFormat = button.getAttribute('data-format'); render(); }; }); if (byId('generate')) byId('generate').onclick = generateDraft; if (byId('saveSample')) byId('saveSample').onclick = saveSample; if (byId('saveDraft')) byId('saveDraft').onclick = saveDraft; if (byId('copyDraft')) byId('copyDraft').onclick = function () { if (navigator.clipboard) navigator.clipboard.writeText(byId('editor').innerText); alert('Copied'); }; if (byId('scheduleButton')) byId('scheduleButton').onclick = function () { byId('scheduleBox').style.display = byId('scheduleBox').style.display === 'none' ? 'block' : 'none'; }; if (byId('addSchedule')) byId('addSchedule').onclick = addSchedule; }
  async function boot() { try { var sessionResult = await supabaseClient.auth.getSession(); user = sessionResult.data && sessionResult.data.session ? sessionResult.data.session.user : null; if (user) await loadData(); render(); } catch (error) { showError(error); } }
  boot();
})();
</script>
</body>
</html>
