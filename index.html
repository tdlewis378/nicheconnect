<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NicheConnect</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#7139F5;--b:#2458D8;--ink:#17112D;--muted:#64748B;--soft:#F5F6FA;--line:#E7E9F0}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--soft)}button,input,textarea,select{font:inherit}.hidden{display:none!important}.brand{font-weight:800;font-size:20px;display:flex;gap:9px;align-items:center}.mark{width:35px;height:35px;border-radius:10px;background:linear-gradient(135deg,var(--p),var(--b));color:#fff;display:grid;place-items:center}.grad{background:linear-gradient(135deg,var(--p),var(--b));-webkit-background-clip:text;color:transparent}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:750;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#fff;border:1px solid #dfe2ea;color:var(--ink)}.auth{max-width:460px;margin:70px auto;padding:30px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 40px #17112d12}.auth h1{margin:25px 0 7px;font-size:29px}.auth p{color:var(--muted);font-size:14px;line-height:1.5}.form{display:grid;gap:13px}.form label{font-size:13px;font-weight:700}.input{width:100%;margin-top:6px;border:1px solid #dfe2ea;border-radius:9px;padding:11px;outline:none;background:#fff}.input:focus{border-color:var(--p);box-shadow:0 0 0 3px #7139f522}.full{width:100%}.link{border:0;background:none;color:var(--p);font-weight:750;cursor:pointer}.divider{display:flex;align-items:center;gap:10px;color:#94a3b8;font-size:12px;margin:18px 0}.divider:before,.divider:after{content:'';height:1px;background:var(--line);flex:1}.msg{padding:10px;border-radius:9px;font-size:13px;margin-top:12px}.ok{background:#eaf8ef;color:#166534}.err{background:#fef2f2;color:#b91c1c}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;z-index:5}.topright{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}.layout{display:flex}.side{width:230px;background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 68px);padding:18px}.nav{width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:10px;color:var(--muted);font-weight:700;cursor:pointer;margin:2px 0}.nav.active,.nav:hover{background:#eee8ff;color:var(--p)}.main{flex:1;padding:30px;max-width:1250px}.heading{display:flex;justify-content:space-between;gap:20px;align-items:start;margin-bottom:25px}.heading h1{margin:0;font-size:32px}.heading p,.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 18px #17112d08}.stat small{color:var(--muted)}.stat strong{font-size:29px;display:block;margin-top:12px}.twocol{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-top:18px}.card h2{font-size:18px;margin:0}.empty{text-align:center;padding:50px 20px;color:var(--muted)}.row{display:flex;gap:13px;align-items:center;border-top:1px solid var(--line);padding:14px 0}.row:first-child{border-top:0}.grow{flex:1;min-width:0}.row h3{font-size:14px;margin:0 0 5px}.row p{font-size:13px;color:var(--muted);margin:0}.pill{font-size:11px;background:#eee8ff;color:var(--p);font-weight:800;border-radius:99px;padding:5px 8px}.modalbg{position:fixed;inset:0;background:#17112d99;display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(100%,510px);background:#fff;border-radius:17px;padding:24px;position:relative}.close{position:absolute;right:16px;top:12px;border:0;background:none;font-size:25px;cursor:pointer}@media(max-width:800px){.side{width:64px;padding:12px 8px}.side .label{display:none}.nav{text-align:center;padding:12px 4px}.main{padding:20px 14px}.grid{grid-template-columns:repeat(2,1fr)}.twocol{grid-template-columns:1fr}.heading{display:block}}
</style>
</head>
<body><div id="root"><div class="auth"><div class="brand"><div class="mark">✦</div><span>Niche<span class="grad">Connect</span></span></div><h1>Loading NicheConnect…</h1><p>Connecting securely.</p></div></div>
<script>
(function(){
var sb=window.supabase.createClient('https://xpsvypsbquakrvbhujdn.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhwc3Z5cHNicXVha3J2Ymh1amRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NTA5MDIsImV4cCI6MjEwOTEyNjkwMn0.d_tEW2KIHpgX5sfxAjS9X3ilYnf7FZVLYRPpsdGmUE0');
var user=null,profile=null,opps=[],page='dashboard',mode='signin';
function el(id){return document.getElementById(id)}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}function msg(text,ok){return '<div class="msg '+(ok?'ok':'err')+'">'+esc(text)+'</div>'}
async function load(){if(!user)return;var p=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=p.data||{email:user.email};var o=await sb.from('opportunities').select('*').order('created_at',{ascending:false});opps=o.data||[]}
function authScreen(){return '<div class="auth"><div class="brand"><div class="mark">✦</div><span>Niche<span class="grad">Connect</span></span></div><h1 id="authTitle">Welcome back</h1><p id="authSub">Sign in to continue to your private workspace.</p><form class="form" id="authForm"><label id="nameWrap" class="hidden">Name or business<input class="input" id="name"></label><label>Email address<input class="input" id="email" type="email" required></label><label>Password<input class="input" id="password" type="password" minlength="8" required></label><button class="btn primary full" id="submitBtn">Sign in</button></form><button class="link" id="forgot">Forgot password?</button><div class="divider">OR</div><button class="btn secondary full" id="google">Continue with Google</button><div id="authMsg"></div><p style="text-align:center;margin-top:18px"><span id="switchText">New to NicheConnect?</span> <button class="link" id="switch">Create account</button></p></div>'}
function render(){if(!user){el('root').innerHTML=authScreen();wireAuth();return}el('root').innerHTML=workspace();wireApp()}
function wireAuth(){el('authForm').onsubmit=authSubmit;el('switch').onclick=function(){mode=mode==='signin'?'signup':'signin';el('authTitle').textContent=mode==='signup'?'Create your account':'Welcome back';el('authSub').textContent=mode==='signup'?'Start building a focused engagement workflow.':'Sign in to continue to your private workspace.';el('nameWrap').classList.toggle('hidden',mode!=='signup');el('submitBtn').textContent=mode==='signup'?'Create account':'Sign in';el('forgot').classList.toggle('hidden',mode==='signup');el('switchText').textContent=mode==='signup'?'Already have an account?':'New to NicheConnect?';el('switch').textContent=mode==='signup'?'Sign in':'Create account'};el('forgot').onclick=async function(){var r=await sb.auth.resetPasswordForEmail(el('email').value,{redirectTo:location.href});el('authMsg').innerHTML=r.error?msg(r.error.message):msg('Password reset email sent.',true)};el('google').onclick=async function(){var r=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});if(r.error)el('authMsg').innerHTML=msg(r.error.message)} }
async function authSubmit(e){e.preventDefault();var r;if(mode==='signup')r=await sb.auth.signUp({email:el('email').value,password:el('password').value,options:{data:{full_name:el('name').value},emailRedirectTo:location.href}});else r=await sb.auth.signInWithPassword({email:el('email').value,password:el('password').value});if(r.error){el('authMsg').innerHTML=msg(r.error.message);return}if(mode==='signup')el('authMsg').innerHTML=msg('Account created. Check your email to confirm it, then sign in.',true);else{user=r.data.user;await load();render()}}
function workspace(){return '<header class="top"><div class="brand"><div class="mark">✦</div><span>Niche<span class="grad">Connect</span></span></div><div class="topright"><span>'+(profile&&profile.is_admin?'Owner / Admin':'Workspace')+'</span><span>'+esc(user.email)+'</span><button class="btn secondary" id="logout">Sign out</button></div></header><div class="layout"><aside class="side">'+[['dashboard','▦','Dashboard'],['discover','⌕','Discover'],['planner','✓','Planner'],['settings','⚙','Settings']].map(function(x){return '<button class="nav '+(page===x[0]?'active':'')+'" data-page="'+x[0]+'"><b>'+x[1]+'</b> <span class="label">'+x[2]+'</span></button>'}).join('')+'</aside><main class="main">'+view()+'</main></div>'}
function head(t,s,b){return '<div class="heading"><div><h1>'+t+'</h1><p>'+s+'</p></div>'+(b||'')+'</div>'}function view(){if(page==='discover')return discover();if(page==='planner')return planner();if(page==='settings')return settings();return dashboard()}
function dashboard(){return head('Your engagement cockpit','A focused view of the conversations and relationships that matter.','<button class="btn primary" id="add">+ Add opportunity</button>')+'<div class="grid"><div class="card stat"><small>Opportunities saved</small><strong>'+opps.length+'</strong></div><div class="card stat"><small>Today’s tasks</small><strong>0</strong></div><div class="card stat"><small>Comments drafted</small><strong>0</strong></div><div class="card stat"><small>Follow-ups due</small><strong>0</strong></div></div><div class="twocol"><div class="card"><h2>Today’s action queue</h2>'+(opps.length?opps.slice(0,5).map(function(o){return '<div class="row"><div class="grow"><h3>'+esc(o.title)+'</h3><p>'+esc(o.source_text||'Review and contribute thoughtfully.')+'</p></div><span class="pill">'+esc(o.status||'New')+'</span></div>'}).join(''):'<div class="empty">Save an opportunity to begin.</div>')+'</div><div class="card"><h2>Your method</h2>'+['Discover','Match','Contribute','Connect'].map(function(x,i){return '<div class="row"><span class="pill">'+(i+1)+'</span><div><h3>'+x+'</h3><p>'+['Find worthwhile conversations.','Prioritize what fits.','Prepare a useful response.','Track genuine interactions.'][i]+'</p></div></div>'}).join('')+'</div></div>'}
function discover(){return head('Discover opportunities','Save conversations you can genuinely contribute to.','<button class="btn primary" id="add">+ Add opportunity</button>')+'<div class="card">'+(opps.length?opps.map(function(o){return '<div class="row"><div class="grow"><h3>'+esc(o.title)+'</h3><p>'+esc(o.source_text||'No source text supplied.')+'</p>'+(o.url?'<a href="'+esc(o.url)+'" target="_blank" rel="noopener noreferrer">Open original</a>':'')+'</div><span class="pill">'+esc(o.opportunity_type||'Post')+'</span><button class="btn secondary" data-del="'+o.id+'">Delete</button></div>'}).join(''):'<div class="empty"><h2>No opportunities yet</h2><p>Add a public link and conversation text.</p><button class="btn primary" id="add">Add your first opportunity</button></div>')+'</div>'}
function planner(){return head('Daily planner','Your queue will appear as opportunities are analyzed.')+'<div class="card empty"><h2>Your queue is ready</h2><p>Start in Discover.</p><button class="btn primary" data-page="discover">Go to Discover</button></div>'}function settings(){return head('Settings','Update the profile context used for recommendations.')+'<div class="card"><form class="form" id="profileForm"><label>Creator or business name<input class="input" id="pn" value="'+esc(profile&&profile.creator_name)+'"></label><label>Primary niche<input class="input" id="pi" value="'+esc(profile&&profile.niche)+'"></label><label>Business description<textarea class="input" id="pd" rows="4">'+esc(profile&&profile.business_description)+'</textarea></label><label>Ideal audience<input class="input" id="pa" value="'+esc(profile&&profile.ideal_audience)+'"></label><button class="btn primary">Save profile</button></form><div id="setmsg"></div></div><div class="card" style="margin-top:18px"><h2>Account status</h2><p class="muted">'+(profile&&profile.is_admin?'Owner/admin access enabled. AI usage exemption enabled.':'Standard workspace account.')+'</p></div>'}
function wireApp(){el('logout').onclick=async function(){await sb.auth.signOut();user=null;render()};document.querySelectorAll('[data-page]').forEach(function(b){b.onclick=function(){page=b.dataset.page;render()}});var add=el('add');if(add)add.onclick=openOpp;document.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){removeOpp(b.dataset.del)}});var pf=el('profileForm');if(pf)pf.onsubmit=saveProfile}
function openOpp(){var w=document.createElement('div');w.className='modalbg';w.id='modal';w.innerHTML='<div class="modal"><button class="close" id="close">×</button><h2>Add opportunity</h2><p class="muted">Use information you supplied or are authorized to access.</p><form class="form" id="oppForm"><label>Title<input class="input" id="ot" required></label><label>Public URL<input class="input" id="ou" type="url"></label><label>Type<select class="input" id="oy"><option>Post</option><option>Group</option><option>Page</option><option>Creator profile</option></select></label><label>Conversation text<textarea class="input" id="ox" rows="6" required></textarea></label><button class="btn primary">Save opportunity</button><div id="omsg"></div></form></div>';document.body.appendChild(w);el('close').onclick=function(){w.remove()};el('oppForm').onsubmit=async function(e){e.preventDefault();var r=await sb.from('opportunities').insert({user_id:user.id,title:el('ot').value,url:el('ou').value,opportunity_type:el('oy').value,source_text:el('ox').value,status:'New'});if(r.error){el('omsg').innerHTML=msg(r.error.message);return}w.remove();await load();page='discover';render()}}
async function removeOpp(id){var r=await sb.from('opportunities').delete().eq('id',id);if(r.error)alert(r.error.message);await load();render()}async function saveProfile(e){e.preventDefault();var r=await sb.from('profiles').upsert({id:user.id,email:user.email,creator_name:el('pn').value,niche:el('pi').value,business_description:el('pd').value,ideal_audience:el('pa').value,updated_at:new Date().toISOString()});el('setmsg').innerHTML=msg(r.error?r.error.message:'Profile saved.',!r.error);await load()}
async function boot(){var r=await sb.auth.getSession();user=r.data&&r.data.session?r.data.session.user:null;await load();render();sb.auth.onAuthStateChange(function(e,s){user=s&&s.user?s.user:null;if(user)load().then(render);else render()})}boot();
})();
</script>
</body></html>
