<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NicheConnect — Today</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--p:#7139F5;--b:#2458D8;--ink:#17112D;--muted:#64748B;--soft:#F5F6FA;--line:#E7E9F0}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--soft);color:var(--ink)}button,input,textarea,select{font:inherit}.brand{font-weight:800;font-size:20px;display:flex;align-items:center;gap:9px}.mark{width:35px;height:35px;border-radius:10px;background:linear-gradient(135deg,var(--p),var(--b));color:#fff;display:grid;place-items:center}.grad{background:linear-gradient(135deg,var(--p),var(--b));-webkit-background-clip:text;color:transparent}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:750;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#fff;border:1px solid #dfe2ea;color:var(--ink)}.auth,.onboard{max-width:720px;margin:55px auto;padding:30px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 35px #17112d0d}.auth{max-width:460px}.auth h1,.onboard h1{margin:24px 0 8px}.muted{color:var(--muted);line-height:1.5;font-size:14px}.form{display:grid;gap:13px}.form label{font-size:13px;font-weight:700}.input{width:100%;margin-top:6px;border:1px solid #dfe2ea;border-radius:9px;padding:11px;background:#fff}.link{border:0;background:none;color:var(--p);font-weight:750;cursor:pointer}.msg{padding:10px;border-radius:9px;font-size:13px;margin-top:12px}.ok{background:#eaf8ef;color:#166534}.err{background:#fef2f2;color:#b91c1c}.divider{display:flex;gap:10px;align-items:center;color:#94a3b8;font-size:12px;margin:18px 0}.divider:before,.divider:after{content:'';height:1px;background:var(--line);flex:1}.progress{display:flex;gap:8px;margin:24px 0}.dot{height:6px;flex:1;border-radius:99px;background:#e5e7eb}.dot.active{background:var(--p)}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:9px 12px;border:1px solid #dfe2ea;border-radius:99px;background:#fff;color:#475569;cursor:pointer;font-size:13px}.chip.selected{background:#eee8ff;color:var(--p);border-color:var(--p);font-weight:700}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{border:1px solid #dfe2ea;border-radius:12px;padding:14px;display:flex;gap:9px;cursor:pointer;font-size:13px}.choice:has(input:checked){border-color:var(--p);background:#faf9ff}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;z-index:5}.topright{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:13px}.layout{display:flex}.side{width:225px;background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 68px);padding:18px}.nav{width:100%;text-align:left;border:0;background:none;padding:12px;border-radius:10px;color:var(--muted);font-weight:700;cursor:pointer;margin:2px 0}.nav.active,.nav:hover{background:#eee8ff;color:var(--p)}.main{flex:1;padding:30px;max-width:1180px}.heading{display:flex;justify-content:space-between;gap:20px;align-items:start;margin-bottom:24px}.heading h1{margin:0;font-size:32px;letter-spacing:-.04em}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 18px #17112d08}.stat small{color:var(--muted)}.stat strong{font-size:28px;display:block;margin-top:10px}.hero{background:linear-gradient(135deg,#21164b,#30236b);color:#fff;border-radius:18px;padding:23px;display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:18px}.hero h2{font-size:21px;margin:0}.hero p{font-size:13px;color:#d9d3f2;margin:7px 0 0}.bar{height:8px;background:#ffffff30;border-radius:99px;overflow:hidden;margin-top:8px}.bar span{display:block;height:100%;background:#b9a6ff}.queue{background:#fff;border:1px solid var(--line);border-radius:17px;padding:21px;margin-top:18px}.queuehead{display:flex;justify-content:space-between;align-items:center}.queue h2{font-size:18px;margin:0}.task{display:flex;gap:13px;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}.task.done{opacity:.55;background:#fafafa}.check{width:22px;height:22px;border-radius:50%;border:2px solid #cbd5e1;background:#fff;flex:none;cursor:pointer}.done .check{background:#22a559;border-color:#22a559}.taskbody{flex:1}.tasktop{display:flex;justify-content:space-between;gap:10px}.task h3{font-size:14px;margin:0}.task p{font-size:13px;color:var(--muted);line-height:1.5;margin:8px 0}.badge,.pill{font-size:10px;font-weight:800;padding:5px 8px;border-radius:99px;background:#eee8ff;color:var(--p);white-space:nowrap}.high{background:#eaf8ef;color:#16733b}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:12px;padding:8px 10px}.row{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:14px 0}.row:first-child{border-top:0}.grow{flex:1}.row h3{font-size:14px;margin:0 0 5px}.row p{font-size:13px;color:var(--muted);margin:0}.empty{text-align:center;padding:45px 20px;color:var(--muted)}.modalbg{position:fixed;inset:0;background:#17112d99;display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(100%,510px);background:#fff;border-radius:17px;padding:24px;position:relative}.close{position:absolute;right:16px;top:12px;border:0;background:none;font-size:25px;cursor:pointer}@media(max-width:800px){.side{width:64px;padding:12px 8px}.side .label{display:none}.nav{text-align:center;padding:12px 4px}.main{padding:20px 14px}.grid{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.twocol{grid-template-columns:1fr}.heading{display:block}.hero{display:block}.hero .budget{margin-top:18px}}
</style></head><body><div id="root"><div class="auth"><div class="brand"><span class="mark">✦</span><span>Niche<span class="grad">Connect</span></span></div><h1>Loading NicheConnect…</h1><p class="muted">Connecting securely.</p></div></div><script>(function(){const sb=window.supabase.createClient('https://xpsvypsbquakrvbhujdn.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhwc3Z5cHNicXVha3J2Ymh1amRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NTA5MDIsImV4cCI6MjEwOTEyNjkwMn0.d_tEW2KIHpgX5sfxAjS9X3ilYnf7FZVLYRPpsdGmUE0');let user=null,profile=null,page='today',opps=[],communities=[],relationships=[],tasks=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const msg=(t,ok)=>'<div class="msg '+(ok?'ok':'err')+'">'+esc(t)+'</div>';async function load(){if(!user)return;let p=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=p.data||{email:user.email,onboarding_completed:true,daily_minutes:15};let a=await sb.from('opportunities').select('*').order('created_at',{ascending:false});opps=a.data||[];let c=await sb.from('communities').select('*').order('created_at',{ascending:false});communities=c.data||[];let r=await sb.from('relationships').select('*').order('created_at',{ascending:false});relationships=r.data||[];let t=await sb.from('daily_tasks').select('*').order('created_at',{ascending:false});tasks=t.data||[]}
function render(){if(!user){$('root').innerHTML=auth();$('af').onsubmit=login;return}$('root').innerHTML=app();wire()};function auth(){return '<div class="auth"><div class="brand"><span class="mark">✦</span><span>Niche<span class="grad">Connect</span></span></div><h1>Welcome back</h1><p class="muted">Sign in to your private workspace.</p><form class="form" id="af"><label>Email<input class="input" id="em" type="email" required></label><label>Password<input class="input" id="pw" type="password" required></label><button class="btn primary">Sign in</button></form><div id="am"></div></div>'};async function login(e){e.preventDefault();let r=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});if(r.error)$('am').innerHTML=msg(r.error.message);else{user=r.data.user;await load();render()}}
function app(){return '<header class="top"><div class="brand"><span class="mark">✦</span><span>Niche<span class="grad">Connect</span></span></div><div class="topright"><span>'+(profile?.is_admin?'Owner / Admin':'Workspace')+'</span><span>'+esc(user.email)+'</span><button class="btn secondary" id="out">Sign out</button></div></header><div class="layout"><aside class="side">'+[['today','▦','Today'],['discover','⌕','Discover'],['communities','♧','Communities'],['relationships','♡','Connections'],['planner','✓','Planner'],['settings','⚙','Settings']].map(x=>'<button class="nav '+(page===x[0]?'active':'')+'" data-page="'+x[0]+'"><b>'+x[1]+'</b> <span class="label">'+x[2]+'</span></button>').join('')+'</aside><main class="main">'+view()+'</main></div>'}
function head(t,s,b){return '<div class="heading"><div><h1>'+t+'</h1><p class="muted">'+s+'</p></div>'+(b||'')+'</div>'};function view(){if(page==='discover')return discover();if(page==='communities')return communitiesView();if(page==='relationships')return relationshipsView();if(page==='planner')return planner();if(page==='settings')return settings();return today()}
function today(){let limit=Math.max(1,Math.floor((profile.daily_minutes||15)/5)),items=[...tasks];if(!items.length){items=opps.slice(0,limit).map(o=>({id:null,title:o.title,description:o.source_text,estimated_minutes:5,status:'Open',opportunity_id:o.id,url:o.url,type:'opportunity'}));relationships.filter(r=>r.follow_up_date).slice(0,Math.max(0,limit-items.length)).forEach(r=>items.push({id:null,title:'Follow up with '+r.contact_name,description:r.notes,estimated_minutes:5,status:'Open',type:'relationship'}))}items=items.slice(0,limit);let done=items.filter(x=>String(x.status).toLowerCase()==='completed').length;return head('Today','Your next best actions, based on your available time.', '<select class="btn secondary" id="budget"><option value="5" '+(profile.daily_minutes==5?'selected':'')+'>5 minutes</option><option value="10" '+(profile.daily_minutes==10?'selected':'')+'>10 minutes</option><option value="15" '+(profile.daily_minutes==15?'selected':'')+'>15 minutes</option><option value="30" '+(profile.daily_minutes==30?'selected':'')+'>30 minutes</option></select>')+'<section class="hero"><div><h2>A meaningful '+(profile.daily_minutes||15)+' minutes</h2><p>'+items.length+' focused action'+(items.length===1?'':'s')+' selected for your niche and goals.</p></div><div class="budget" style="min-width:220px"><div style="display:flex;justify-content:space-between;font-size:12px"><span>Today’s progress</span><b>'+done+' of '+items.length+' complete</b></div><div class="bar"><span style="width:'+(items.length?Math.round(done/items.length*100):0)+'%"></span></div></div></section><div class="grid"><div class="card stat"><small>Recommended actions</small><strong>'+items.length+'</strong></div><div class="card stat"><small>Estimated time</small><strong>'+items.length*5+' min</strong></div><div class="card stat"><small>Follow-ups due</small><strong>'+relationships.filter(x=>x.follow_up_date).length+'</strong></div><div class="card stat"><small>Saved opportunities</small><strong>'+opps.length+'</strong></div></div><section class="queue"><div style="display:flex;justify-content:space-between"><h2 style="margin:0;font-size:18px">Your next best actions</h2><span class="muted" style="font-size:12px">Prioritized for you</span></div>'+(items.length?items.map(taskCard).join(''):'<div class="empty"><h3>Your plan is ready to build</h3><p>Add an opportunity in Discover to create today’s action queue.</p><button class="btn primary" data-page="discover">Go to Discover</button></div>')+'</section>'}
function taskCard(x){let complete=String(x.status).toLowerCase()==='completed';return '<article class="task '+(complete?'done':'')+'"><button class="check" data-task="'+(x.id||'')+'" aria-label="Mark complete"></button><div class="taskbody"><div class="tasktop"><h3>'+esc(x.title)+'</h3><span class="badge high">'+(x.type==='relationship'?'FOLLOW UP':'RECOMMENDED')+' · '+(x.estimated_minutes||5)+' MIN</span></div><p>'+esc(x.description||x.recommended_action||'Review and contribute thoughtfully.')+'</p><div class="actions">'+(x.url?'<a class="btn secondary small" href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">Open original</a>':'')+(x.opportunity_id?'<button class="btn primary small" data-review="'+x.opportunity_id+'">Review</button>':'')+(x.id&&!complete?'<button class="btn secondary small" data-skip="'+x.id+'">Skip</button>':'')+'</div></div></article>'}
function discover(){return head('Discover opportunities','Add public links or supplied conversation text for review.','<button class="btn primary" data-open="opportunity">+ Add opportunity</button>')+'<div class="card">'+(opps.length?opps.map(o=>'<div class="row"><div class="grow"><h3>'+esc(o.title)+'</h3><p>'+esc(o.source_text||'No source text')+'</p>'+(o.url?'<a href="'+esc(o.url)+'" target="_blank" rel="noopener noreferrer">Open original</a>':'')+'</div><span class="pill">'+esc(o.status||'New')+'</span></div>').join(''):'<div class="empty"><h3>No opportunities yet</h3><button class="btn primary" data-open="opportunity">Add opportunity</button></div>')+'</div>'}
function communitiesView(){return head('Community library','Save groups, pages, and creators worth revisiting.','<button class="btn primary" data-open="community">+ Save community</button>')+'<div class="card">'+(communities.length?communities.map(c=>'<div class="row"><div class="grow"><h3>'+esc(c.name)+'</h3><p>'+esc(c.description||'Saved community')+'</p></div><span class="pill">'+(c.is_favorite?'Favorite':'Saved')+'</span></div>').join(''):'<div class="empty">No communities saved yet.</div>')+'</div>'}
function relationshipsView(){return head('Connections','Track genuine interactions and manual follow-ups.','<button class="btn primary" data-open="relationship">+ Add connection</button>')+'<div class="card">'+(relationships.length?relationships.map(r=>'<div class="row"><div class="grow"><h3>'+esc(r.contact_name)+'</h3><p>'+esc(r.relationship_status||'New')+' · '+esc(r.notes||'No notes')+'</p></div><span class="pill">'+(r.follow_up_date?'Follow up '+esc(r.follow_up_date):'Saved')+'</span></div>').join(''):'<div class="empty">No connections saved yet.</div>')+'</div>'}
function planner(){return head('Planner','Your Today plan is generated from saved opportunities and follow-ups.')+'<div class="card empty"><h3>Use Today as your task list</h3><p>Choose your time budget and complete the recommended actions there.</p><button class="btn primary" data-page="today">Open Today</button></div>'};function settings(){return head('Settings','Manage your workspace preferences.')+'<div class="card"><h2>Account status</h2><p class="muted">'+(profile?.is_admin?'Owner/admin access enabled.':'Standard workspace.')+'</p><p class="muted">Niche: '+esc(profile?.niche||'Not set')+'</p><p class="muted">Daily budget: '+(profile?.daily_minutes||15)+' minutes</p></div>'}
function wire(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$('out').onclick=async()=>{await sb.auth.signOut();user=null;render()};let budget=$('budget');if(budget)budget.onchange=async()=>{let v=Number(budget.value);await sb.from('profiles').update({daily_minutes:v}).eq('id',user.id);profile.daily_minutes=v;render()};document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>completeTask(b.dataset.task));document.querySelectorAll('[data-skip]').forEach(b=>b.onclick=()=>skipTask(b.dataset.skip));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openModal(b.dataset.open));document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{page='discover';render()})}
async function completeTask(id){if(!id)return;let r=await sb.from('daily_tasks').update({status:'Completed',completed_at:new Date().toISOString()}).eq('id',id);if(r.error)alert(r.error.message);await load();render()}async function skipTask(id){let r=await sb.from('daily_tasks').update({status:'Skipped'}).eq('id',id);if(r.error)alert(r.error.message);await load();render()}
function openModal(type){let c=type==='community',rel=type==='relationship',w=document.createElement('div');w.className='modalbg';w.innerHTML='<div class="modal"><button class="close" id="cx">×</button><h2>'+(c?'Save community':rel?'Add connection':'Add opportunity')+'</h2><form class="form" id="mf">'+(c?'<label>Name<input class="input" id="n" required></label><label>Public URL<input class="input" id="u" type="url"></label><label>Description<textarea class="input" id="d" rows="3"></textarea></label>':rel?'<label>Contact name<input class="input" id="n" required></label><label>Profile URL<input class="input" id="u" type="url"></label><label>Follow-up date<input class="input" id="fd" type="date"></label><label>Notes<textarea class="input" id="d" rows="3"></textarea></label>':'<label>Title<input class="input" id="n" required></label><label>Public URL<input class="input" id="u" type="url"></label><label>Conversation text<textarea class="input" id="d" rows="5" required></textarea></label>')+'<button class="btn primary">Save</button><div id="mm"></div></form></div>';document.body.appendChild(w);$('cx').onclick=()=>w.remove();$('mf').onsubmit=async e=>{e.preventDefault();let table=c?'communities':rel?'relationships':'opportunities',payload=c?{user_id:user.id,name:$('n').value,url:$('u').value,description:$('d').value}:rel?{user_id:user.id,contact_name:$('n').value,profile_url:$('u').value,follow_up_date:$('fd').value||null,notes:$('d').value,relationship_status:'New'}:{user_id:user.id,title:$('n').value,url:$('u').value,source_text:$('d').value,status:'New',opportunity_type:'Post'};let r=await sb.from(table).insert(payload);if(r.error){$('mm').innerHTML=msg(r.error.message);return}if(!c&&!rel){let o=r.data&&r.data[0];if(o){await sb.from('daily_tasks').insert({user_id:user.id,opportunity_id:o.id,title:o.title,recommended_action:'Review and contribute thoughtfully.',estimated_minutes:5,status:'Open'})}}w.remove();await load();render()}}
async function boot(){let r=await sb.auth.getSession();user=r.data?.session?.user||null;if(user)await load();render()}boot()})();</script></body></html>
