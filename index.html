<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NicheConnect</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--p:#7139F5;--b:#2458D8;--ink:#17112D;--muted:#64748B;--soft:#F5F6FA;--line:#E7E9F0}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--soft);color:var(--ink)}button,input,textarea,select{font:inherit}.brand{font-weight:800;font-size:20px;display:flex;align-items:center;gap:9px}.mark{width:35px;height:35px;border-radius:10px;background:linear-gradient(135deg,var(--p),var(--b));color:#fff;display:grid;place-items:center}.grad{background:linear-gradient(135deg,var(--p),var(--b));-webkit-background-clip:text;color:transparent}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:750;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#fff;border:1px solid #dfe2ea;color:var(--ink)}.auth{max-width:460px;margin:70px auto;padding:30px;background:#fff;border:1px solid var(--line);border-radius:18px}.form{display:grid;gap:13px}.form label{font-size:13px;font-weight:700}.input{width:100%;margin-top:6px;border:1px solid #dfe2ea;border-radius:9px;padding:11px;background:#fff}.link{border:0;background:none;color:var(--p);font-weight:750;cursor:pointer}.msg{padding:10px;border-radius:9px;font-size:13px;margin-top:12px}.ok{background:#eaf8ef;color:#166534}.err{background:#fef2f2;color:#b91c1c}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;z-index:5}.topright{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:13px}.layout{display:flex}.side{width:230px;background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 68px);padding:18px}.nav{width:100%;text-align:left;border:0;background:none;padding:12px;border-radius:10px;color:var(--muted);font-weight:700;cursor:pointer;margin:2px 0}.nav.active,.nav:hover{background:#eee8ff;color:var(--p)}.main{flex:1;padding:30px;max-width:1250px}.heading{display:flex;justify-content:space-between;gap:20px;align-items:start;margin-bottom:25px}.heading h1{margin:0;font-size:32px}.muted{color:var(--muted);line-height:1.5}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 18px #17112d08}.stat small{color:var(--muted)}.stat strong{font-size:29px;display:block;margin-top:12px}.twocol{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-top:18px}.card h2{font-size:18px;margin:0 0 8px}.row{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:14px 0}.row:first-child{border-top:0}.grow{flex:1}.row h3{font-size:14px;margin:0 0 5px}.row p{font-size:13px;color:var(--muted);margin:0}.pill{font-size:11px;background:#eee8ff;color:var(--p);font-weight:800;border-radius:99px;padding:5px 8px}.empty{text-align:center;padding:55px 20px;color:var(--muted)}.modalbg{position:fixed;inset:0;background:#17112d99;display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(100%,510px);background:#fff;border-radius:17px;padding:24px;position:relative}.close{position:absolute;right:16px;top:12px;border:0;background:none;font-size:25px;cursor:pointer}@media(max-width:800px){.side{width:64px;padding:12px 8px}.side .label{display:none}.nav{text-align:center;padding:12px 4px}.main{padding:20px 14px}.grid{grid-template-columns:repeat(2,1fr)}.twocol{grid-template-columns:1fr}.heading{display:block}}
</style></head><body><div id="root"><div class="auth"><div class="brand"><span class="mark">✦</span><span>Niche<span class="grad">Connect</span></span></div><h1>Loading NicheConnect…</h1><p class="muted">Connecting securely.</p></div></div><script>(function(){const sb=window.supabase.createClient('https://xpsvypsbquakrvbhujdn.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhwc3Z5cHNicXVha3J2Ymh1amRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NTA5MDIsImV4cCI6MjEwOTEyNjkwMn0.d_tEW2KIHpgX5sfxAjS9X3ilYnf7FZVLYRPpsdGmUE0');let user=null,profile=null,page='dashboard',opps=[],communities=[],relationships=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const msg=(t,ok)=>'<div class="msg '+(ok?'ok':'err')+'">'+esc(t)+'</div>';
async function load(){if(!user)return;let p=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=p.data||{email:user.email,onboarding_completed:true};let a=await sb.from('opportunities').select('*').order('created_at',{ascending:false});opps=a.data||[];let c=await sb.from('communities').select('*').order('created_at',{ascending:false});communities=c.data||[];let r=await sb.from('relationships').select('*').order('created_at',{ascending:false});relationships=r.data||[]}
function render(){if(!user){$('root').innerHTML=auth();$('af').onsubmit=login;return}$('root').innerHTML=app();wire()}
function auth(){return '<div class="auth"><div class="brand"><span class="mark">✦</span><span>Niche<span class="grad">Connect</span></span></div><h1>Welcome back</h1><p class="muted">Sign in to your private workspace.</p><form class="form" id="af"><label>Email<input class="input" id="em" type="email" required></label><label>Password<input class="input" id="pw" type="password" required></label><button class="btn primary">Sign in</button></form><div id="am"></div></div>'}
async function login(e){e.preventDefault();let r=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});if(r.error)$('am').innerHTML=msg(r.error.message);else{user=r.data.user;await load();render()}}
function app(){return '<header class="top"><div class="brand"><span class="mark">✦</span><span>Niche<span class="grad">Connect</span></span></div><div class="topright"><span>'+(profile?.is_admin?'Owner / Admin':'Workspace')+'</span><span>'+esc(user.email)+'</span><button class="btn secondary" id="out">Sign out</button></div></header><div class="layout"><aside class="side">'+[['dashboard','▦','Dashboard'],['discover','⌕','Discover'],['communities','♧','Communities'],['relationships','♡','Relationships'],['planner','✓','Planner'],['settings','⚙','Settings']].map(x=>'<button class="nav '+(page===x[0]?'active':'')+'" data-page="'+x[0]+'"><b>'+x[1]+'</b> <span class="label">'+x[2]+'</span></button>').join('')+'</aside><main class="main">'+view()+'</main></div>'}
function head(t,s,b){return '<div class="heading"><div><h1>'+t+'</h1><p class="muted">'+s+'</p></div>'+(b||'')+'</div>'}
function view(){if(page==='discover')return discover();if(page==='communities')return communitiesView();if(page==='relationships')return relationshipsView();if(page==='planner')return planner();if(page==='settings')return settings();return dashboard()}
function dashboard(){return head('Your engagement cockpit','A focused view of the conversations and relationships that matter.','<button class="btn primary" data-open="community">+ Save community</button>')+'<div class="grid"><div class="card stat"><small>Opportunities</small><strong>'+opps.length+'</strong></div><div class="card stat"><small>Communities</small><strong>'+communities.length+'</strong></div><div class="card stat"><small>Relationships</small><strong>'+relationships.length+'</strong></div><div class="card stat"><small>Follow-ups due</small><strong>'+relationships.filter(x=>x.follow_up_date).length+'</strong></div></div><div class="twocol"><div class="card"><h2>Recent opportunities</h2>'+(opps.slice(0,5).map(o=>'<div class="row"><div class="grow"><h3>'+esc(o.title)+'</h3><p>'+esc(o.source_text||'Saved opportunity')+'</p></div><span class="pill">'+esc(o.status||'New')+'</span></div>').join('')||'<div class="empty">No opportunities saved yet.</div>')+'</div><div class="card"><h2>Your workflow</h2>'+['Discover relevant conversations','Match them to your niche','Review useful drafts','Track relationships','Follow up manually'].map((x,i)=>'<div class="row"><span class="pill">'+(i+1)+'</span><div><h3>'+x+'</h3></div></div>').join('')+'</div></div>'}
function discover(){return head('Discover opportunities','Add public links or supplied conversation text for review.','<button class="btn primary" data-open="opportunity">+ Add opportunity</button>')+'<div class="card">'+(opps.length?opps.map(o=>'<div class="row"><div class="grow"><h3>'+esc(o.title)+'</h3><p>'+esc(o.source_text||'No source text')+'</p>'+(o.url?'<a href="'+esc(o.url)+'" target="_blank" rel="noopener noreferrer">Open original</a>':'')+'</div><span class="pill">'+esc(o.opportunity_type||'Post')+'</span><button class="btn secondary" data-del="opportunity|'+o.id+'">Delete</button></div>').join(''):'<div class="empty"><h2>No opportunities yet</h2><button class="btn primary" data-open="opportunity">Add opportunity</button></div>')+'</div>'}
function communitiesView(){return head('Community library','Save groups, pages, and creators worth revisiting.','<button class="btn primary" data-open="community">+ Save community</button>')+'<div class="card">'+(communities.length?communities.map(c=>'<div class="row"><div class="grow"><h3>'+esc(c.name)+'</h3><p>'+esc(c.description||'Saved community')+'</p>'+(c.url?'<a href="'+esc(c.url)+'" target="_blank" rel="noopener noreferrer">Open original</a>':'')+'</div><span class="pill">'+(c.is_favorite?'Favorite':'Saved')+'</span><button class="btn secondary" data-del="community|'+c.id+'">Delete</button></div>').join(''):'<div class="empty"><h2>No communities yet</h2><button class="btn primary" data-open="community">Save community</button></div>')+'</div>'}
function relationshipsView(){return head('Relationships','Track genuine interactions and manual follow-ups.','<button class="btn primary" data-open="relationship">+ Add relationship</button>')+'<div class="card">'+(relationships.length?relationships.map(r=>'<div class="row"><div class="grow"><h3>'+esc(r.contact_name)+'</h3><p>'+esc(r.relationship_status||'New')+' · '+esc(r.notes||'No notes')+'</p>'+(r.follow_up_date?'<p>Follow up: '+esc(r.follow_up_date)+'</p>':'')+'</div><button class="btn secondary" data-del="relationship|'+r.id+'">Delete</button></div>').join(''):'<div class="empty"><h2>No relationships yet</h2><button class="btn primary" data-open="relationship">Add relationship</button></div>')+'</div>'}
function planner(){return head('Daily planner','A realistic queue based on your available time.')+'<div class="card empty"><h2>Your planner is ready</h2><p>Saved opportunities will become actions here as the matching workflow is added.</p><button class="btn primary" data-page="discover">Go to Discover</button></div>'}function settings(){return head('Settings','Manage your profile and workspace preferences.')+'<div class="card"><h2>Account status</h2><p class="muted">'+(profile?.is_admin?'Owner/admin access enabled.':'Standard workspace.')+'</p><p class="muted">Niche: '+esc(profile?.niche||'Not set')+'</p><p class="muted">Engagement mode: '+esc(profile?.engagement_mode||'review')+'</p></div>'}
function wire(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$('out').onclick=async()=>{await sb.auth.signOut();user=null;render()};document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openModal(b.dataset.open));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{let a=b.dataset.del.split('|');remove(a[0],a[1])})}
async function remove(type,id){let table=type==='community'?'communities':type==='relationship'?'relationships':'opportunities';let r=await sb.from(table).delete().eq('id',id);if(r.error)alert(r.error.message);await load();render()}
function openModal(type){let c=type==='community',rel=type==='relationship',w=document.createElement('div');w.className='modalbg';w.innerHTML='<div class="modal"><button class="close" id="cx">×</button><h2>'+(c?'Save community':rel?'Add relationship':'Add opportunity')+'</h2><form class="form" id="mf">'+(c?'<label>Name<input class="input" id="n" required></label><label>Public URL<input class="input" id="u" type="url"></label><label>Description<textarea class="input" id="d" rows="3"></textarea></label><label><input id="f" type="checkbox"> Favorite</label>':rel?'<label>Contact name<input class="input" id="n" required></label><label>Profile URL<input class="input" id="u" type="url"></label><label>Status<select class="input" id="s"><option>New</option><option>Engaged</option><option>Familiar</option><option>Connected</option><option>Follow Up</option></select></label><label>Follow-up date<input class="input" id="fd" type="date"></label><label>Notes<textarea class="input" id="d" rows="3"></textarea></label>':'<label>Title<input class="input" id="n" required></label><label>Public URL<input class="input" id="u" type="url"></label><label>Conversation text<textarea class="input" id="d" rows="5" required></textarea></label>')+'<button class="btn primary">Save</button><div id="mm"></div></form></div>';document.body.appendChild(w);$('cx').onclick=()=>w.remove();$('mf').onsubmit=async e=>{e.preventDefault();let table=c?'communities':rel?'relationships':'opportunities',payload=c?{user_id:user.id,name:$('n').value,url:$('u').value,description:$('d').value,is_favorite:$('f').checked}:rel?{user_id:user.id,contact_name:$('n').value,profile_url:$('u').value,relationship_status:$('s').value,follow_up_date:$('fd').value||null,notes:$('d').value}:{user_id:user.id,title:$('n').value,url:$('u').value,source_text:$('d').value,status:'New',opportunity_type:'Post'};let r=await sb.from(table).insert(payload);if(r.error){$('mm').innerHTML=msg(r.error.message);return}w.remove();await load();render()}}
async function boot(){let r=await sb.auth.getSession();user=r.data?.session?.user||null;if(user)await load();render()}boot()})();</script></body></html>
