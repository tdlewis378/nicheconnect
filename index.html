<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NicheConnect Content Studio</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--p:#7139F5;--b:#2458D8;--ink:#17112D;--muted:#64748B;--bg:#F5F6FA;--line:#E7E9F0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.brand{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:800}.mark{width:35px;height:35px;border-radius:10px;background:linear-gradient(135deg,var(--p),var(--b));color:#fff;display:grid;place-items:center}.grad{background:linear-gradient(135deg,var(--p),var(--b));-webkit-background-clip:text;color:transparent}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:750}.primary{background:var(--p);color:#fff}.secondary{background:#fff;border:1px solid #dfe2ea;color:var(--ink)}.auth{max-width:460px;margin:70px auto;padding:30px;background:#fff;border:1px solid var(--line);border-radius:18px}.form{display:grid;gap:13px}.form label{font-size:13px;font-weight:700}.input{width:100%;margin-top:6px;padding:11px;border:1px solid #dfe2ea;border-radius:9px;background:#fff}.msg{padding:10px;border-radius:9px;font-size:13px;margin-top:12px}.error{background:#fff0f0;color:#a11}.success{background:#eaf8ef;color:#166534}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px}.topright{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}.layout{display:flex}.side{width:235px;background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 68px);padding:18px}.nav{display:block;width:100%;border:0;background:none;text-align:left;padding:12px;border-radius:10px;color:var(--muted);font-weight:700;margin:2px 0}.nav.active,.nav:hover{background:#eee8ff;color:var(--p)}.main{flex:1;max-width:1250px;padding:30px}.heading{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}.heading h1{margin:0;font-size:31px}.muted{color:var(--muted);font-size:14px;line-height:1.5}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 18px #17112d08}.studio{display:grid;grid-template-columns:350px 1fr;gap:18px}.chip{border:1px solid #dfe2ea;border-radius:99px;background:#fff;padding:8px 10px;font-size:12px;margin:3px}.chip.selected{background:#eee8ff;border-color:var(--p);color:var(--p);font-weight:700}.draft{min-height:280px;border:1px solid #dfe2ea;border-radius:12px;padding:15px;margin-top:14px;white-space:pre-wrap;line-height:1.65;outline:none}.draft:focus{border-color:var(--p)}.row{display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);padding:13px 0}.row:first-child{border-top:0}.grow{flex:1}.pill{font-size:10px;font-weight:800;padding:5px 8px;border-radius:99px;background:#eee8ff;color:var(--p)}.empty{text-align:center;padding:35px;color:var(--muted)}.hidden{display:none}@media(max-width:850px){.side{width:64px;padding:12px 8px}.nav{font-size:0;text-align:center}.nav:before{content:'•';font-size:20px}.main{padding:20px 14px}.studio{grid-template-columns:1fr}.heading{display:block}}
</style></head><body><div id="root"><div class="auth"><div class="brand"><span class="mark">✦</span><span>Niche<span class="grad">Connect</span></span></div><h1>Loading NicheConnect...</h1><p class="muted">Connecting securely.</p></div></div><script>
(function(){
'use strict';
var sb=window.supabase.createClient('https://xpsvypsbquakrvbhujdn.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhwc3Z5cHNicXVha3J2Ymh1amRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NTA5MDIsImV4cCI6MjEwOTEyNjkwMn0.d_tEW2KIHpgX5sfxAjS9X3ilYnf7FZVLYRPpsdGmUE0');
var user=null,profile=null,drafts=[],samples=[],schedules=[],format='Text post',page='studio';
function $(id){return document.getElementById(id)}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}function notice(text,ok){$('notice').innerHTML='<div class="msg '+(ok?'success':'error')+'">'+esc(text)+'</div>'}
async function load(){var p=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(p.error)throw p.error;profile=p.data||{};var d=await sb.from('content_drafts').select('*').order('created_at',{ascending:false});if(d.error)throw d.error;drafts=d.data||[];var s=await sb.from('voice_samples').select('*').order('created_at',{ascending:false});if(s.error)throw s.error;samples=s.data||[];var q=await sb.from('content_schedule').select('*').order('scheduled_for',{ascending:true});if(q.error)throw q.error;schedules=q.data||[]}
function auth(){return '<div class="auth"><div class="brand"><span class="mark">✦</span><span>Niche<span class="grad">Connect</span></span></div><h1>Welcome back</h1><p class="muted">Sign in to your private workspace.</p><form class="form" id="login"><label>Email<input class="input" id="email" type="email" required></label><label>Password<input class="input" id="password" type="password" required></label><button class="btn primary">Sign in</button></form><div id="loginNotice"></div></div>'}
async function login(e){e.preventDefault();var r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error){$('loginNotice').innerHTML='<div class="msg error">'+esc(r.error.message)+'</div>';return}user=r.data.user;try{await load();render()}catch(x){error(x)}}
function error(e){$('root').innerHTML='<div class="auth"><h1>Workspace error</h1><p class="muted">'+esc(e.message)+'</p><button class="btn primary" onclick="location.reload()">Try again</button></div>'}
function render(){if(!user){$('root').innerHTML=auth();$('login').onsubmit=login;return}$('root').innerHTML=app();wire()}
function app(){return '<header class="top"><div class="brand"><span class="mark">✦</span><span>Niche<span class="grad">Connect</span></span></div><div class="topright"><span>OpenAI Content Studio</span><span>'+esc(user.email)+'</span><button class="btn secondary" id="logout">Sign out</button></div></header><div class="layout"><aside class="side"><button class="nav active">✦ Content Studio</button><button class="nav" id="todayNav">▦ Today</button><button class="nav" id="settingsNav">⚙ Settings</button></aside><main class="main">'+studio()+'</main></div>'}
function studio(){var queue=schedules.length?schedules.map(function(x){return '<div class="row"><div class="grow"><b>Scheduled draft</b><p class="muted">'+new Date(x.scheduled_for).toLocaleString()+' · '+esc(x.publish_mode)+'</p></div><span class="pill">'+esc(x.status)+'</span></div>'}).join(''):'<div class="empty">No scheduled posts yet.</div>';return '<div class="heading"><div><h1>Content Studio</h1><p class="muted">Generate original drafts using your approved writing samples and voice profile.</p></div><button class="btn primary" id="generate">Generate with OpenAI</button></div><div class="studio"><section class="card"><h2>Draft setup</h2><p class="muted">OpenAI uses only the samples you approve.</p><div class="form"><label>Goal<select class="input" id="goal"><option>Teach something useful</option><option>Start a conversation</option><option>Tell a personal story</option><option>Build trust</option><option>Promote an offer</option></select></label><label>Topic<textarea class="input" id="topic" rows="4" placeholder="What should this post be about?"></textarea></label><label>Format</label><div><button type="button" class="chip selected" data-format="Text post">Text post</button><button type="button" class="chip" data-format="Story + lesson">Story + lesson</button><button type="button" class="chip" data-format="Short video script">Short video script</button></div><label>Call to action<select class="input" id="cta"><option>Ask a thoughtful question</option><option>Invite a comment</option><option>Softly mention my offer</option><option>No CTA</option></select></label><label>Writing sample<textarea class="input" id="sample" rows="5" placeholder="Paste something you wrote in your own voice."></textarea></label><button class="btn secondary" id="saveSample">Save voice sample</button><p class="muted">'+samples.length+' saved sample(s).</p></div></section><section class="card"><h2>AI draft workspace</h2><p class="muted">Generate, edit, save, and schedule. Publishing stays review-controlled.</p><input class="input" id="title" placeholder="Draft title"><div class="draft" id="editor" contenteditable="true">Your AI draft will appear here.</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn primary" id="saveDraft">Save draft</button><button class="btn secondary" id="copy">Copy</button><button class="btn secondary" id="scheduleButton">Schedule</button></div><div id="scheduleBox" class="hidden" style="margin-top:12px"><label>Scheduled for<input class="input" id="when" type="datetime-local"></label><button class="btn primary" id="addSchedule" style="margin-top:10px">Add to weekly queue</button></div><div id="notice"></div></section></div><section class="card" style="margin-top:18px"><h2>Weekly queue</h2>'+queue+'</section>'}
async function generate(){var topic=$('topic').value.trim();if(!topic){notice('Enter a topic first.');return}var session=await sb.auth.getSession();var body={action:'generate_draft',topic:topic,goal:$('goal').value,format:format,call_to_action:$('cta').value,niche:profile.niche||'',audience:profile.ideal_audience||'',samples:samples.map(function(x){return x.sample_text}),voice_profile:profile.voice_profile||null};var result=await sb.functions.invoke('content-ai',{body:body});if(result.error){notice(result.error.message);return}if(result.data&&result.data.error){notice(result.data.error);return}var draft=result.data.draft;if(!draft){notice('The AI returned no draft.');return}$('title').value=draft.title||topic;$('editor').innerText=draft.body||'';notice('Draft generated with OpenAI. Voice confidence: '+(draft.confidence||'not provided')+'%.',true)}
async function buildVoice(){if(!samples.length){notice('Save at least one writing sample first.');return}var result=await sb.functions.invoke('content-ai',{body:{action:'voice_profile',samples:samples.map(function(x){return x.sample_text})}});if(result.error){notice(result.error.message);return}var p=result.data&&result.data.profile;if(!p){notice('No voice profile returned.');return}var update=await sb.from('voice_profiles').upsert({user_id:user.id,summary:p.voice_summary||'',tone:p.tone||'',style_rules:p.recurring_patterns||[],prohibited_patterns:p.avoid||[],confidence:p.confidence||0,updated_at:new Date().toISOString()});if(update.error){notice(update.error.message);return}notice('Voice profile generated and saved.',true)}
async function saveSample(){var text=$('sample').value.trim();if(!text){notice('Add a writing sample first.');return}var r=await sb.from('voice_samples').insert({user_id:user.id,sample_text:text,source_label:'Content Studio'});if(r.error){notice(r.error.message);return}await load();render();notice('Voice sample saved.',true)}
async function saveDraft(){var r=await sb.from('content_drafts').insert({user_id:user.id,title:$('title').value,topic:$('topic').value,goal:$('goal').value,format:format,call_to_action:$('cta').value,body:$('editor').innerText,status:'Draft',approval_status:'Needs review'});if(r.error){notice(r.error.message);return}await load();render()}
async function addSchedule(){var d=await sb.from('content_drafts').insert({user_id:user.id,title:$('title').value,topic:$('topic').value,goal:$('goal').value,format:format,call_to_action:$('cta').value,body:$('editor').innerText,status:'Draft',approval_status:'Needs review'}).select().single();if(d.error){notice(d.error.message);return}var q=await sb.from('content_schedule').insert({user_id:user.id,draft_id:d.data.id,scheduled_for:$('when').value,status:'Queued',publish_mode:'Manual approval'});if(q.error){notice(q.error.message);return}await load();render()}
function wire(){document.querySelectorAll('[data-format]').forEach(function(b){b.onclick=function(){format=b.getAttribute('data-format');document.querySelectorAll('[data-format]').forEach(function(x){x.classList.remove('selected')});b.classList.add('selected')}});$('logout').onclick=async function(){await sb.auth.signOut();user=null;render()};$('generate').onclick=generate;$('saveSample').onclick=saveSample;$('saveDraft').onclick=saveDraft;$('copy').onclick=function(){if(navigator.clipboard)navigator.clipboard.writeText($('editor').innerText);notice('Copied to clipboard.',true)};$('scheduleButton').onclick=function(){$('scheduleBox').classList.toggle('hidden')};$('addSchedule').onclick=addSchedule;$('todayNav').onclick=function(){notice('Today view will be connected next.')};$('settingsNav').onclick=function(){notice('Settings view will be connected next.')}}
async function boot(){try{var session=await sb.auth.getSession();user=session.data&&session.data.session?session.data.session.user:null;if(user)await load();render()}catch(e){error(e)}}
boot();
})();
</script></body></html>
