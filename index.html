<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NicheConnect</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--p:#7139F5;--b:#2458D8;--ink:#17112D;--muted:#64748B;--soft:#F5F6FA;--line:#E7E9F0}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--soft);color:var(--ink)}button,input,textarea,select{font:inherit}.brand{font-weight:800;font-size:20px;display:flex;align-items:center;gap:9px}.mark{width:35px;height:35px;border-radius:10px;background:linear-gradient(135deg,var(--p),var(--b));color:#fff;display:grid;place-items:center}.grad{background:linear-gradient(135deg,var(--p),var(--b));-webkit-background-clip:text;color:transparent}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:750;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#fff;border:1px solid #dfe2ea;color:var(--ink)}.auth{max-width:460px;margin:70px auto;padding:30px;background:#fff;border:1px solid var(--line);border-radius:18px}.auth h1{margin:25px 0 7px}.auth p,.muted{color:var(--muted);font-size:14px}.form{display:grid;gap:13px}.form label{font-size:13px;font-weight:700}.input{width:100%;margin-top:6px;border:1px solid #dfe2ea;border-radius:9px;padding:11px;background:#fff}.full{width:100%}.link{border:0;background:none;color:var(--p);font-weight:750;cursor:pointer}.msg{padding:10px;border-radius:9px;font-size:13px;margin-top:12px}.ok{background:#eaf8ef;color:#166534}.err{background:#fef2f2;color:#b91c1c}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;z-index:5}.topright{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:13px}.layout{display:flex}.side{width:230px;background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 68px);padding:18px}.nav{width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:10px;color:var(--muted);font-weight:700;cursor:pointer;margin:2px 0}.nav.active,.nav:hover{background:#eee8ff;color:var(--p)}.main{flex:1;padding:30px;max-width:1250px}.heading{display:flex;justify-content:space-between;gap:20px;align-items:start;margin-bottom:25px}.heading h1{margin:0;font-size:32px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 18px #17112d08}.stat small{color:var(--muted)}.stat strong{font-size:29px;display:block;margin-top:12px}.twocol{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-top:18px}.card h2{font-size:18px;margin:0}.empty{text-align:center;padding:50px 20px;color:var(--muted)}.row{display:flex;gap:13px;align-items:center;border-top:1px solid var(--line);padding:14px 0}.row:first-child{border-top:0}.grow{flex:1;min-width:0}.row h3{font-size:14px;margin:0 0 5px}.row p{font-size:13px;color:var(--muted);margin:0}.pill{font-size:11px;background:#eee8ff;color:var(--p);font-weight:800;border-radius:99px;padding:5px 8px}.modalbg{position:fixed;inset:0;background:#17112d99;display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(100%,510px);background:#fff;border-radius:17px;padding:24px;position:relative}.close{position:absolute;right:16px;top:12px;border:0;background:none;font-size:25px;cursor:pointer}@media(max-width:800px){.side{width:64px;padding:12px 8px}.side .label{display:none}.nav{text-align:center;padding:12px 4px}.main{padding:20px 14px}.grid{grid-template-columns:repeat(2,1fr)}.twocol{grid-template-columns:1fr}.heading{display:block}}</style></head><body><div id="root"><div class="auth"><div class="brand"><div class="mark">✦</div><span>Niche<span class="grad">Connect</span></span></div><h1>Loading NicheConnect…</h1><p>Connecting securely.</p></div></div><script>(function(){const sb=window.supabase.createClient('https://xpsvypsbquakrvbhujdn.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhwc3Z5cHNicXVha3J2Ymh1amRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NTA5MDIsImV4cCI6MjEwOTEyNjkwMn0.d_tEW2KIHpgX5sfxAjS9X3ilYnf7FZVLYRPpsdGmUE0');let user=null,profile=null,page='dashboard',opps=[],communities=[],relationships=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){if(!user)return;let p=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=p.data||{email:user.email};let o=await sb.from('opportunities').select('*').order('created_at',{ascending:false});opps=o.data||[];let c=await sb.from('communities').select('*').order('created_at',{ascending:false});communities=c.data||[];let r=await sb.from('relationships').select('*').order('created_at',{ascending:false});relationships=r.data||[]}function msg(t,ok){return '<div class="msg '+(ok?'ok':'err')+'">'+esc(t)+'</div>'}function auth(){return '<div class="auth"><div class="brand"><div class="mark">✦</div><span>Niche<span class="grad">Connect</span></span></div><h1>Welcome back</h1><p>Sign in to your private workspace.</p><form class="form" id="af"><label>Email<input class="input" id="em" type="email" required></label><label>Password<input class="input" id="pw" type="password" required></label><button class="btn primary">Sign in</button></form><div id="am"></div><p style="text-align:center">Need an account? <button class="link" onclick="alert('Use the signup form on the landing page, then return here to sign in.')">Create account</button></p></div>'}function render(){if(!user){$('root').innerHTML=auth();$('af').onsubmit=async e=>{e.preventDefault();let r=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});if(r.error)$('am').innerHTML=msg(r.error.message);else{user=r.data.user;await load();render()}};return}$('root').innerHTML='<header class="top"><div class="brand"><div class="mark">✦</div><span>Niche<span class="grad">Connect</span></span></div><div class="topright"><span>'+(profile?.is_admin?'Owner / Admin':'Workspace')+'</span><span>'+esc(user.email)+'</span><button class="btn secondary" id="out">Sign out</button></div></header><div class="layout"><aside class="side">'+[['dashboard','▦','Dashboard'],['discover','⌕','Discover'],['communities','♧','Communities'],['relationships','♡','Relationships'],['planner','✓','Planner'],['settings','⚙','Settings']].map(x=>'<button class="nav '+(page===x[0]?'active':'')+'" data-p="'+x[0]+'"><b>'+x[1]+'</b> <span class="label">'+x[2]+'</span></button>').join('')+'</aside><main class="main">'+view()+'</main></div>';wire()}function head(t,s,b){return '<div class="heading"><div><h1>'+t+'</h1><p class="muted">'+s+'</p></div>'+(b||'')+'</div>'}function view(){if(page==='communities')return communitiesView();if(page==='relationships')return relationshipsView();if(page==='discover')return '<div class="card empty"><h2>Discover</h2><p>Saved opportunities: '+opps.length+'</p></div>';if(page==='planner')return '<div class="card empty"><h2>Daily planner</h2><p>Your analyzed opportunities will become tasks here.</p></div>';if(page==='settings')return '<div class="card"><h2>Settings</h2><p class="muted">Owner/admin access: '+(profile?.is_admin?'Enabled':'Standard')+'</p></div>';return head('Your engagement cockpit','A focused view of your workspace.','<button class="btn primary" data-open="community">+ Save community</button>')+'<div class="grid"><div class="card stat"><small>Opportunities</small><strong>'+opps.length+'</strong></div><div class="card stat"><small>Communities</small><strong>'+communities.length+'</strong></div><div class="card stat"><small>Relationships</small><strong>'+relationships.length+'</strong></div><div class="card stat"><small>Follow-ups</small><strong>'+relationships.filter(x=>x.follow_up_date).length+'</strong></div></div><div class="twocol"><div class="card"><h2>Recent communities</h2>'+(communities.slice(0,4).map(c=>'<div class="row"><div class="grow"><h3>'+esc(c.name)+'</h3><p>'+esc(c.description||'Saved community')+'</p></div><span class="pill">'+(c.is_favorite?'Favorite':'Saved')+'</span></div>').join('')||'<div class="empty">Save your first community.</div>')+'</div><div class="card"><h2>Relationships</h2>'+(relationships.slice(0,4).map(r=>'<div class="row"><div class="grow"><h3>'+esc(r.contact_name)+'</h3><p>'+esc(r.relationship_status||'New')+'</p></div></div>').join('')||'<div class="empty">Add a relationship.</div>')+'</div></div>'}function communitiesView(){return head('Community library','Save groups, pages, and creators worth revisiting.','<button class="btn primary" data-open="community">+ Save community</button>')+'<div class="card">'+(communities.length?communities.map(c=>'<div class="row"><div class="grow"><h3>'+esc(c.name)+'</h3><p>'+esc(c.description||'No description')+'</p>'+(c.url?'<a href="'+esc(c.url)+'" target="_blank" rel="noopener noreferrer">Open original</a>':'')+'</div><span class="pill">'+(c.is_favorite?'★ Favorite':'Saved')+'</span><button class="btn secondary" data-delc="'+c.id+'">Delete</button></div>').join(''):'<div class="empty"><h2>No communities yet</h2><button class="btn primary" data-open="community">Save one</button></div>')+'</div>'}function relationshipsView(){return head('Relationships','Track genuine interactions and manual follow-ups.','<button class="btn primary" data-open="relationship">+ Add relationship</button>')+'<div class="card">'+(relationships.length?relationships.map(r=>'<div class="row"><div class="grow"><h3>'+esc(r.contact_name)+'</h3><p>'+esc(r.relationship_status||'New')+' · '+esc(r.notes||'No notes')+'</p>'+(r.follow_up_date?'<p>Follow up: '+esc(r.follow_up_date)+'</p>':'')+'</div><button class="btn secondary" data-delr="'+r.id+'">Delete</button></div>').join(''):'<div class="empty"><h2>No relationships yet</h2><button class="btn primary" data-open="relationship">Add one</button></div>')+'</div>'}function wire(){$('out').onclick=async()=>{await sb.auth.signOut();user=null;render()};document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{page=b.dataset.p;render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openModal(b.dataset.open));document.querySelectorAll('[data-delc]').forEach(b=>b.onclick=()=>remove('communities',b.dataset.delc));document.querySelectorAll('[data-delr]').forEach(b=>b.onclick=()=>remove('relationships',b.dataset.delr))}async function remove(table,id){await sb.from(table).delete().eq('id',id);await load();render()}function openModal(type){let community=type==='community';let w=document.createElement('div');w.className='modalbg';w.innerHTML='<div class="modal"><button class="close" id="x">×</button><h2>'+(community?'Save community':'Add relationship')+'</h2><form class="form" id="mf">'+(community?'<label>Name<input class="input" id="n" required></label><label>Public URL<input class="input" id="u" type="url"></label><label>Description<textarea class="input" id="d" rows="3"></textarea></label><label><input id="f" type="checkbox"> Favorite</label>':'<label>Contact name<input class="input" id="n" required></label><label>Profile URL<input class="input" id="u" type="url"></label><label>Status<select class="input" id="s"><option>New</option><option>Engaged</option><option>Familiar</option><option>Connected</option><option>Follow Up</option></select></label><label>Follow-up date<input class="input" id="fd" type="date"></label><label>Notes<textarea class="input" id="d" rows="3"></textarea></label>')+'<button class="btn primary">Save</button><div id="mm"></div></form></div>';document.body.appendChild(w);$('x').onclick=()=>w.remove();$('mf').onsubmit=async e=>{e.preventDefault();let payload=community?{user_id:user.id,name:$('n').value,url:$('u').value,description:$('d').value,is_favorite:$('f').checked}:{user_id:user.id,contact_name:$('n').value,profile_url:$('u').value,relationship_status:$('s').value,follow_up_date:$('fd').value||null,notes:$('d').value};let r=await sb.from(community?'communities':'relationships').insert(payload);if(r.error)$('mm').innerHTML=msg(r.error.message);else{w.remove();await load();render()}}}async function boot(){let r=await sb.auth.getSession();user=r.data?.session?.user||null;await load();render();sb.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;if(user)load().then(render);else render()})}boot()})();</script></body></html>
