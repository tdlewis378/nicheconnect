<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NicheConnect</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#7139F5;--b:#2458D8;--ink:#17112D;--muted:#64748B;--soft:#F5F6FA;--line:#E7E9F0}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--soft);color:var(--ink)}button,input,textarea,select{font:inherit}.brand{font-weight:800;font-size:20px;display:flex;align-items:center;gap:9px}.mark{width:35px;height:35px;border-radius:10px;background:linear-gradient(135deg,var(--p),var(--b));color:#fff;display:grid;place-items:center}.grad{background:linear-gradient(135deg,var(--p),var(--b));-webkit-background-clip:text;color:transparent}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:750;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#fff;border:1px solid #dfe2ea;color:var(--ink)}.auth,.onboard{max-width:720px;margin:50px auto;padding:30px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 35px #17112d0d}.auth{max-width:460px}.auth h1,.onboard h1{margin:24px 0 8px}.muted{color:var(--muted);line-height:1.55;font-size:14px}.form{display:grid;gap:14px}.form label{font-size:13px;font-weight:700}.input{width:100%;margin-top:6px;border:1px solid #dfe2ea;border-radius:9px;padding:11px;background:#fff;outline:none}.input:focus{border-color:var(--p);box-shadow:0 0 0 3px #7139f522}.msg{padding:10px;border-radius:9px;font-size:13px;margin-top:12px}.ok{background:#eaf8ef;color:#166534}.err{background:#fef2f2;color:#b91c1c}.link{border:0;background:none;color:var(--p);font-weight:750;cursor:pointer}.divider{display:flex;gap:10px;align-items:center;color:#94a3b8;font-size:12px;margin:18px 0}.divider:before,.divider:after{content:'';height:1px;background:var(--line);flex:1}.progress{display:flex;gap:8px;margin:24px 0}.dot{height:6px;flex:1;border-radius:99px;background:#e5e7eb}.dot.active{background:var(--p)}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:9px 12px;border:1px solid #dfe2ea;border-radius:99px;background:#fff;color:#475569;cursor:pointer;font-size:13px}.chip.selected{background:#eee8ff;color:var(--p);border-color:var(--p);font-weight:700}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{border:1px solid #dfe2ea;border-radius:12px;padding:14px;display:flex;gap:9px;cursor:pointer;font-size:13px}.choice:has(input:checked){border-color:var(--p);background:#faf9ff}.choice small{display:block;color:var(--muted);margin-top:4px;line-height:1.4}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px}.topright{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:13px}.layout{display:flex}.side{width:230px;background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 68px);padding:18px}.nav{width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:10px;color:var(--muted);font-weight:700;cursor:pointer;margin:2px 0}.nav.active,.nav:hover{background:#eee8ff;color:var(--p)}.main{flex:1;padding:30px;max-width:1250px}.heading{display:flex;justify-content:space-between;gap:20px;align-items:start;margin-bottom:25px}.heading h1{margin:0;font-size:32px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.stat small{color:var(--muted)}.stat strong{font-size:29px;display:block;margin-top:12px}.empty{text-align:center;padding:50px 20px;color:var(--muted)}@media(max-width:800px){.side{width:64px;padding:12px 8px}.side .label{display:none}.nav{text-align:center;padding:12px 4px}.main{padding:20px 14px}.grid{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.heading{display:block}}
</style>
</head>
<body><div id="root"><div class="auth"><div class="brand"><span class="mark">✦</span><span>Niche<span class="grad">Connect</span></span></div><h1>Loading NicheConnect…</h1><p class="muted">Connecting securely.</p></div></div>
<script>
(function(){
const sb=window.supabase.createClient('https://xpsvypsbquakrvbhujdn.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhwc3Z5cHNicXVha3J2Ymh1amRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NTA5MDIsImV4cCI6MjEwOTEyNjkwMn0.d_tEW2KIHpgX5sfxAjS9X3ilYnf7FZVLYRPpsdGmUE0');
let user=null,profile=null,authMode='signin',onStep=1,page='dashboard';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function msg(t,ok){return '<div class="msg '+(ok?'ok':'err')+'">'+esc(t)+'</div>'}
function render(){if(!user){$('root').innerHTML=auth();wireAuth();return}if(!profile||!profile.onboarding_completed){$('root').innerHTML=onboarding();wireOnboarding();return}$('root').innerHTML=workspace();wireWorkspace()}
function auth(){return '<div class="auth"><div class="brand"><span class="mark">✦</span><span>Niche<span class="grad">Connect</span></span></div><h1 id="at">Welcome back</h1><p id="as">Sign in to your private workspace.</p><form class="form" id="af"><label id="nw" style="display:none">Name or business<input class="input" id="name"></label><label>Email<input class="input" id="email" type="email" required></label><label>Password<input class="input" id="password" type="password" minlength="8" required></label><button class="btn primary">Sign in</button></form><button class="link" id="forgot">Forgot password?</button><div class="divider">OR</div><button class="btn secondary" id="google">Continue with Google</button><div id="am"></div><p style="text-align:center"><span id="switchText">New to NicheConnect?</span> <button class="link" id="switch">Create account</button></p></div>'}
function wireAuth(){$('af').onsubmit=async e=>{e.preventDefault();let r=authMode==='signup'?await sb.auth.signUp({email:$('email').value,password:$('password').value,options:{data:{full_name:$('name').value},emailRedirectTo:location.href}}):await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)$('am').innerHTML=msg(r.error.message);else if(authMode==='signup')$('am').innerHTML=msg('Account created. Check your email, confirm it, then sign in.',true);else{user=r.data.user;await loadProfile();render()}};$('switch').onclick=()=>{authMode=authMode==='signin'?'signup':'signin';$('at').textContent=authMode==='signup'?'Create your account':'Welcome back';$('as').textContent=authMode==='signup'?'Start building your focused engagement workflow.':'Sign in to your private workspace.';$('nw').style.display=authMode==='signup'?'block':'none';$('af').querySelector('button').textContent=authMode==='signup'?'Create account':'Sign in';$('forgot').style.display=authMode==='signup'?'none':'inline-block';$('switchText').textContent=authMode==='signup'?'Already have an account?':'New to NicheConnect?';$('switch').textContent=authMode==='signup'?'Sign in':'Create account'};$('forgot').onclick=async()=>{let r=await sb.auth.resetPasswordForEmail($('email').value,{redirectTo:location.href});$('am').innerHTML=r.error?msg(r.error.message):msg('Password reset email sent.',true)};$('google').onclick=async()=>{let r=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});if(r.error)$('am').innerHTML=msg(r.error.message)}}
function onboarding(){let titles=['Your business foundation','Your ideal audience','Your community radar','Your engagement control','Review your setup'];return '<div class="onboard"><div class="brand"><span class="mark">✦</span><span>Niche<span class="grad">Connect</span></span></div><div class="progress">'+[1,2,3,4,5].map(i=>'<span class="dot '+(i<=onStep?'active':'')+'"></span>').join('')+'</div><h1>'+titles[onStep-1]+'</h1><p class="muted">'+['Tell us what you do so we can find better-fit conversations.','Define the people and topics you want to connect with.','Choose the communities and content you want on your radar.','You decide what happens externally. Review-first is recommended.','Confirm these settings before entering your workspace.'][onStep-1]+'</p>'+onboardingBody()+'<div style="display:flex;justify-content:space-between;margin-top:22px"><button class="btn secondary" id="back" '+(onStep===1?'disabled':'')+'>Back</button><button class="btn primary" id="next">'+(onStep===5?'Save setup':'Continue')+'</button></div></div>'}
function onboardingBody(){if(onStep===1)return '<div class="form"><label>Creator or business name<input class="input" id="business" value="'+esc(profile?.creator_name||'')+'" placeholder="e.g. Tim Lewis Coaching"></label><label>Products, services, or expertise<textarea class="input" id="offer" rows="3" placeholder="What do you help people do?">'+esc(profile?.business_description||'')+'</textarea></label><label>Primary niche<select class="input" id="niche"><option value="">Choose a category</option>'+['AI tools & automation','Online business & digital products','Coaching & consulting','Affiliate marketing','Health & wellness','Personal finance','Marketing & content','Career & professional growth','Real estate','Other / custom niche'].map(x=>'<option '+(profile?.niche===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label></div>';if(onStep===2)return '<div class="form"><label>Ideal audience<textarea class="input" id="audience" rows="3">'+esc(profile?.ideal_audience||'')+'</textarea></label><label>Audience interests</label><div class="chips">'+['AI tools','Online income','Digital products','Content creation','Productivity','Marketing','Coaching','Side hustles','Small business','Career change'].map(x=>'<button type="button" class="chip '+((profile?.audience_interests||[]).includes(x)?'selected':'')+'" data-interest="'+x+'">'+x+'</button>').join('')+'</div><label>Priority keywords<input class="input" id="keywords" value="'+esc((profile?.priority_keywords||[]).join(', '))+'" placeholder="Separate keywords with commas"></label><label>Topics to avoid<input class="input" id="avoid" value="'+esc(profile?.topics_to_avoid||'')+'"></label></div>';if(onStep===3)return '<div class="form"><label>Community types</label><div class="grid2">'+['Public Facebook groups','Facebook pages and creators','Public posts','Existing relationships'].map(x=>'<label class="choice"><input type="checkbox" value="'+x+'" '+((profile?.community_types||[]).includes(x)?'checked':'')+'>'+x+'</label>').join('')+'</div><label>Known community links or names<textarea class="input" id="known" rows="4">'+esc(profile?.known_communities||'')+'</textarea></label><p class="muted">NicheConnect will use authorized or user-supplied sources only. It will not request Facebook passwords or scrape private groups.</p></div>';if(onStep===4)return '<div class="form"><label class="choice"><input type="radio" name="mode" value="review" '+((profile?.engagement_mode||'review')==='review'?'checked':'')+'> <span><b>Review before action</b><small>AI prepares suggestions. You review, edit, copy, and manually publish.</small></span></label><label class="choice"><input type="radio" name="mode" value="assist" '+(profile?.engagement_mode==='assist'?'checked':'')+'> <span><b>Assisted browsing</b><small>Collect visible, user-authorized content for your review queue.</small></span></label><label class="choice"><input type="radio" name="mode" value="manual" '+(profile?.engagement_mode==='manual'?'checked':'')+'> <span><b>Manual only</b><small>Use organization, scoring, drafts, and reminders.</small></span></label><p class="muted">Automatic comments, friend requests, group joining, and unsolicited messages are not enabled. External actions remain user-controlled.</p></div>';return '<div class="card"><p><b>Niche:</b> '+esc(profile?.niche||'Not selected')+'</p><p><b>Audience:</b> '+esc(profile?.ideal_audience||'Not added')+'</p><p><b>Engagement mode:</b> '+esc(profile?.engagement_mode||'review')+'</p><p><b>Account:</b> '+esc(user.email)+'</p></div>'}
function wireOnboarding(){$('next').onclick=async()=>{if(onStep<5){await saveStep();onStep++;render()}else{await saveStep();await sb.from('profiles').update({onboarding_completed:true}).eq('id',user.id);await loadProfile();render()}};$('back').onclick=()=>{if(onStep>1){onStep--;render()}};document.querySelectorAll('[data-interest]').forEach(b=>b.onclick=()=>b.classList.toggle('selected'))}
async function saveStep(){let patch={updated_at:new Date().toISOString()};if(onStep===1){patch.creator_name=$('business').value;patch.business_description=$('offer').value;patch.niche=$('niche').value}if(onStep===2){patch.ideal_audience=$('audience').value;patch.audience_interests=[...document.querySelectorAll('[data-interest].selected')].map(x=>x.dataset.interest);patch.priority_keywords=$('keywords').value.split(',').map(x=>x.trim()).filter(Boolean);patch.topics_to_avoid=$('avoid').value}if(onStep===3){patch.community_types=[...document.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value);patch.known_communities=$('known').value}if(onStep===4)patch.engagement_mode=document.querySelector('input[name=mode]:checked')?.value||'review';let r=await sb.from('profiles').upsert({...patch,id:user.id,email:user.email});if(r.error)alert(r.error.message)}
function workspace(){return '<header class="top"><div class="brand"><span class="mark">✦</span><span>Niche<span class="grad">Connect</span></span></div><div class="topright"><span>'+(profile?.is_admin?'Owner / Admin':'Workspace')+'</span><span>'+esc(user.email)+'</span><button class="btn secondary" id="out">Sign out</button></div></header><div class="layout"><aside class="side">'+[['dashboard','▦','Dashboard'],['communities','♧','Communities'],['relationships','♡','Relationships'],['discover','⌕','Discover'],['settings','⚙','Settings']].map(x=>'<button class="nav '+(page===x[0]?'active':'')+'" data-page="'+x[0]+'"><b>'+x[1]+'</b> <span class="label">'+x[2]+'</span></button>').join('')+'</aside><main class="main">'+(page==='settings'?'<div class="card"><h2>Settings</h2><p class="muted">Onboarding complete. Owner/admin access: '+(profile?.is_admin?'enabled':'standard')+'.</p><button class="btn secondary" id="redo">Redo onboarding</button></div>':'<div class="heading"><div><h1>Your engagement cockpit</h1><p class="muted">Your personalized discovery workflow is ready.</p></div></div><div class="grid"><div class="card stat"><small>Opportunities</small><strong>0</strong></div><div class="card stat"><small>Communities</small><strong>0</strong></div><div class="card stat"><small>Relationships</small><strong>0</strong></div><div class="card stat"><small>Mode</small><strong style="font-size:18px">'+esc(profile?.engagement_mode||'review')+'</strong></div></div><div class="card" style="margin-top:18px"><h2>Next recommended action</h2><p class="muted">Your profile is ready. The next step is connecting discovery sources and building your review queue.</p></div>')+'</main></div>'}function wireWorkspace(){$('out').onclick=async()=>{await sb.auth.signOut();user=null;render()};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});if($('redo'))$('redo').onclick=async()=>{await sb.from('profiles').update({onboarding_completed:false}).eq('id',user.id);await loadProfile();onStep=1;render()}}
async function loadProfile(){let r=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=r.data||{email:user.email,onboarding_completed:false}}async function boot(){try{let r=await sb.auth.getSession();user=r.data?.session?.user||null;if(user)await loadProfile();render()}catch(e){$('root').innerHTML='<div class="auth"><h1>Connection problem</h1><p class="muted">'+esc(e.message)+'</p><button class="btn primary" onclick="location.reload()">Try again</button></div>'}}boot();
})();
</script></body></html>
