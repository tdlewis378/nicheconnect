<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NicheConnect Workspace</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f6fa;color:#17112d}button,input,textarea,select{font:inherit}.top{height:68px;background:#fff;border-bottom:1px solid #e7e9f0;display:flex;align-items:center;justify-content:space-between;padding:0 25px}.brand{font-weight:800;font-size:20px;display:flex;gap:9px;align-items:center}.mark{width:35px;height:35px;border-radius:10px;background:linear-gradient(135deg,#7139f5,#2458d8);color:#fff;display:grid;place-items:center}.grad{background:linear-gradient(135deg,#7139f5,#2458d8);-webkit-background-clip:text;color:transparent}.topright{display:flex;align-items:center;gap:12px;color:#64748b;font-size:13px}.layout{display:flex}.side{width:230px;background:#fff;border-right:1px solid #e7e9f0;min-height:calc(100vh - 68px);padding:18px}.nav{width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:10px;color:#64748b;font-weight:700;cursor:pointer;margin:2px 0}.nav.active,.nav:hover{background:#eee8ff;color:#7139f5}.main{flex:1;padding:30px;max-width:1250px}.heading{display:flex;justify-content:space-between;gap:20px;align-items:start;margin-bottom:25px}.heading h1{margin:0;font-size:32px}.heading p,.muted{color:#64748b}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid #e7e9f0;border-radius:16px;padding:20px;box-shadow:0 4px 18px #17112d08}.stat small{color:#64748b}.stat strong{font-size:29px;display:block;margin-top:12px}.twocol{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-top:18px}.card h2{font-size:18px;margin:0}.empty{text-align:center;padding:50px 20px;color:#64748b}.row{display:flex;gap:13px;align-items:center;border-top:1px solid #e7e9f0;padding:14px 0}.row:first-child{border-top:0}.grow{flex:1;min-width:0}.row h3{font-size:14px;margin:0 0 5px}.row p{font-size:13px;color:#64748b;margin:0}.pill{font-size:11px;background:#eee8ff;color:#7139f5;font-weight:800;border-radius:99px;padding:5px 8px}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:750;cursor:pointer}.primary{background:#7139f5;color:#fff}.secondary{background:#fff;border:1px solid #dfe2ea;color:#17112d}.form{display:grid;gap:13px;max-width:720px}.form label{font-size:13px;font-weight:700}.input{width:100%;margin-top:6px;border:1px solid #dfe2ea;border-radius:9px;padding:11px;outline:none;background:#fff}.modalbg{position:fixed;inset:0;background:#17112d99;display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(100%,510px);background:#fff;border-radius:17px;padding:24px;position:relative}.close{position:absolute;right:16px;top:12px;border:0;background:none;font-size:25px;cursor:pointer}.msg{padding:10px;border-radius:9px;font-size:13px;margin-top:12px}.ok{background:#eaf8ef;color:#166534}.err{background:#fef2f2;color:#b91c1c}.auth{max-width:450px;margin:70px auto;padding:30px;background:#fff;border:1px solid #e7e9f0;border-radius:18px}@media(max-width:800px){.side{width:64px;padding:12px 8px}.side .label{display:none}.nav{text-align:center;padding:12px 4px}.main{padding:20px 14px}.grid{grid-template-columns:repeat(2,1fr)}.twocol{grid-template-columns:1fr}.heading{display:block}}
</style></head>
<body><div id="root"><div class="auth"><div class="brand"><div class="mark">✦</div><span>Niche<span class="grad">Connect</span></span></div><h1>Loading your workspace…</h1><p class="muted">Connecting securely.</p></div></div>
<script>
(function(){
'use strict';
var SUPABASE_URL='https://xpsvypsbquakrvbhujdn.supabase.co';
var SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhwc3Z5cHNicXVha3J2Ymh1amRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NTA5MDIsImV4cCI6MjEwOTEyNjkwMn0.d_tEW2KIHpgX5sfxAjS9X3ilYnf7FZVLYRPpsdGmUE0';
var sb=window.supabase&&window.supabase.createClient?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;var user=null,profile=null,page='dashboard',opps=[];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}
function el(id){return document.getElementById(id)}
function message(text,cls){return '<div class="msg '+(cls||'err')+'">'+esc(text)+'</div>'}
function render(){if(!user){el('root').innerHTML='<div class="auth"><div class="brand"><div class="mark">✦</div><span>Niche<span class="grad">Connect</span></span></div><h1>Session not found</h1><p class="muted">Please return to the landing page and sign in again.</p><a href="./" class="btn primary" style="display:inline-block;text-decoration:none">Return to sign in</a></div>';return}el('root').innerHTML=workspace()}
function workspace(){return '<header class="top"><div class="brand"><div class="mark">✦</div><span>Niche<span class="grad">Connect</span></span></div><div class="topright"><span>'+(profile&&profile.is_admin?'Owner / Admin':'Workspace')+'</span><span>'+esc(user.email)+'</span><button class="btn secondary" id="logoutBtn">Sign out</button></div></header><div class="layout"><aside class="side">'+[['dashboard','▦','Dashboard'],['discover','⌕','Discover'],['planner','✓','Planner'],['settings','⚙','Settings']].map(function(x){return '<button class="nav '+(page===x[0]?'active':'')+'" data-page="'+x[0]+'"><b>'+x[1]+'</b> <span class="label">'+x[2]+'</span></button>'}).join('')+'</aside><main class="main">'+view()+'</main></div>'}
function header(t,s,b){return '<div class="heading"><div><h1>'+t+'</h1><p>'+s+'</p></div>'+(b||'')+'</div>'}
function view(){if(page==='discover')return discover();if(page==='planner')return planner();if(page==='settings')return settings();return dashboard()}
function dashboard(){return header('Your engagement cockpit','A focused view of the conversations and relationships that matter.','<button class="btn primary" id="addBtn">+ Add opportunity</button>')+'<div class="grid"><div class="card stat"><small>Opportunities saved</small><strong>'+opps.length+'</strong></div><div class="card stat"><small>Today’s tasks</small><strong>0</strong></div><div class="card stat"><small>Comments drafted</small><strong>0</strong></div><div class="card stat"><small>Follow-ups due</small><strong>0</strong></div></div><div class="twocol"><div class="card"><h2>Today’s action queue</h2>'+(opps.length?opps.slice(0,5).map(function(o){return '<div class="row"><div class="grow"><h3>'+esc(o.title)+'</h3><p>'+esc(o.source_text||'Review and contribute thoughtfully.')+'</p></div><span class="pill">'+esc(o.status||'New')+'</span></div>'}).join(''):'<div class="empty">Save an opportunity to begin your daily workflow.</div>')+'</div><div class="card"><h2>Your method</h2>'+['Discover','Match','Contribute','Connect'].map(function(x,i){return '<div class="row"><span class="pill">'+(i+1)+'</span><div><h3>'+x+'</h3><p>'+['Find worthwhile conversations.','Prioritize what fits your goals.','Prepare a useful response.','Track genuine interactions.'][i]+'</p></div></div>'}).join('')+'</div></div>'}
function discover(){return header('Discover opportunities','Save conversations you can genuinely contribute to.','<button class="btn primary" id="addBtn">+ Add opportunity</button>')+'<div class="card">'+(opps.length?opps.map(function(o){return '<div class="row"><div class="grow"><h3>'+esc(o.title)+'</h3><p>'+esc(o.source_text||'No source text supplied.')+'</p>'+(o.url?'<a href="'+esc(o.url)+'" target="_blank" rel="noopener noreferrer">Open original</a>':'')+'</div><span class="pill">'+esc(o.opportunity_type||'Post')+'</span><button class="btn secondary" data-delete="'+o.id+'">Delete</button></div>'}).join(''):'<div class="empty"><h2>No opportunities yet</h2><p>Add a public link and supplied conversation text.</p><button class="btn primary" id="addBtn">Add your first opportunity</button></div>')+'</div>'}
function planner(){return header('Daily planner','Your focused queue will appear here as opportunities are analyzed.')+'<div class="card empty"><h2>Your queue is ready to be built</h2><p>Analyze an opportunity to turn it into a daily action.</p><button class="btn primary" data-page="discover">Go to Discover</button></div>'}
function settings(){return header('Settings','Update the profile context used for recommendations.')+'<div class="card"><form class="form" id="profileForm"><label>Creator or business name<input class="input" id="pn" value="'+esc(profile&&profile.creator_name)+'"></label><label>Primary niche<input class="input" id="pi" value="'+esc(profile&&profile.niche)+'"></label><label>Business description<textarea class="input" id="pd" rows="4">'+esc(profile&&profile.business_description)+'</textarea></label><label>Ideal audience<input class="input" id="pa" value="'+esc(profile&&profile.ideal_audience)+'"></label><button class="btn primary">Save profile</button></form><div id="setmsg"></div></div><div class="card" style="margin-top:18px"><h2>Account status</h2><p class="muted">'+(profile&&profile.is_admin?'Owner/admin access enabled. AI usage exemption enabled.':'Standard workspace account.')+'</p></div>'}
function wire(){var navs=document.querySelectorAll('[data-page]');navs.forEach(function(n){n.onclick=function(){page=n.getAttribute('data-page');render();wire()}});var add=el('addBtn');if(add)add.onclick=openOpp;var out=el('logoutBtn');if(out)out.onclick=logout;var pf=el('profileForm');if(pf)pf.onsubmit=saveProfile;document.querySelectorAll('[data-delete]').forEach(function(b){b.onclick=function(){removeOpp(b.getAttribute('data-delete'))}})}
function openOpp(){var wrap=document.createElement('div');wrap.className='modalbg';wrap.id='modal';wrap.innerHTML='<div class="modal"><button class="close" id="closeModal">×</button><h2>Add opportunity</h2><p class="muted">Use information you supplied or are authorized to access.</p><form class="form" id="oppForm"><label>Title<input class="input" id="ot" required placeholder="Conversation title"></label><label>Public URL<input class="input" id="ou" type="url" placeholder="https://facebook.com/..."></label><label>Type<select class="input" id="oy"><option>Post</option><option>Group</option><option>Page</option><option>Creator profile</option></select></label><label>Conversation text<textarea class="input" id="ox" rows="6" required placeholder="Paste the post or conversation text"></textarea></label><button class="btn primary">Save opportunity</button><div id="omsg"></div></form></div>';document.body.appendChild(wrap);el('closeModal').onclick=closeModal;el('oppForm').onsubmit=saveOpp}
function closeModal(){var m=el('modal');if(m)m.remove()}
async function saveOpp(e){e.preventDefault();var r=await sb.from('opportunities').insert({user_id:user.id,title:el('ot').value,url:el('ou').value,opportunity_type:el('oy').value,source_text:el('ox').value,status:'New'});if(r.error){el('omsg').innerHTML=message(r.error.message);return}closeModal();await loadOpps();page='discover';render();wire()}
async function removeOpp(id){var r=await sb.from('opportunities').delete().eq('id',id);if(r.error)alert(r.error.message);await loadOpps();render();wire()}
async function saveProfile(e){e.preventDefault();var r=await sb.from('profiles').upsert({id:user.id,email:user.email,creator_name:el('pn').value,niche:el('pi').value,business_description:el('pd').value,ideal_audience:el('pa').value,updated_at:new Date().toISOString()});el('setmsg').innerHTML=message(r.error?r.error.message:'Profile saved.',r.error?'err':'ok');await loadProfile()}
async function loadProfile(){var r=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=r.data||{id:user.id,email:user.email}}
async function loadOpps(){var r=await sb.from('opportunities').select('*').order('created_at',{ascending:false});opps=r.data||[]}
async function logout(){await sb.auth.signOut();user=null;render()}
async function boot(){if(!sb){el('root').innerHTML='<div class="auth"><h1>Unable to load Supabase</h1><p>Refresh the page and try again.</p></div>';return}var r=await sb.auth.getSession();user=r.data&&r.data.session?r.data.session.user:null;if(user){await loadProfile();await loadOpps()}render();wire()}
boot();
})();
</script></body></html>
